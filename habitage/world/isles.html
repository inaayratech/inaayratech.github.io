      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([s, t]) => K.rb(tb.x + s * 0.55, 0.16, tb.z + t * 0.55, 0.06, 0.16, 0.06, C.wood, 6, 1));
      teaSet(K, tb.x, 0.4, tb.z);
      for (let k = 0; k < 4; k++) { const a = toC + k * Math.PI / 2 + Math.PI / 4, x = tb.x + Math.sin(a) * 1.05, z = tb.z + Math.cos(a) * 1.05; K.rb(x, 0.1, z, 0.34, 0.1, 0.34, [C.rose, C.sage, C.oat, C.dusk][k], 2.6, 2); }
    };

    // the reading chair
    const rd = SLOT.reading;
    B.read_armchair = K => K.armchair(rd.x, rd.z, rd.f, C.sage);
    B.read_rocker = () => ({ parts: [rockingPart(rd.x, rd.z, rd.f, C.sage, 1)] });
    B.read_beanbag = K => {
      K.bl(rd.x, 0.34, rd.z, 0.62, 0.36, 0.6, (x, y) => C.lilac.clone().lerp(C.dusk, 0.35).lerp(C.milk, sm(0.2, 1, y) * 0.15), 0.18, 3);
      K.bl(rd.x - Math.sin(rd.f) * 0.3, 0.6, rd.z - Math.cos(rd.f) * 0.3, 0.46, 0.32, 0.3, C.lilac.clone().lerp(C.dusk, 0.4), 0.18, 2);
      K.rb(rd.x + Math.sin(rd.f) * 0.2, 0.7, rd.z + Math.cos(rd.f) * 0.2, 0.12, 0.02, 0.09, C.clay, 8, 1, rd.f + 0.4);
    };
    const eggBody = K => {
      // an open woven egg: cane ribs round its back, a rim round the opening, cushions in it
      const F0 = [Math.sin(rd.f), 0, Math.cos(rd.f)], Rt = [Math.cos(rd.f), 0, -Math.sin(rd.f)];
      const cy = 1.2, r = 0.55, ry = 0.78, cane = c(0xc89a60), caneD = c(0xa8784a);
      const at = (th, ph) => [rd.x + (-F0[0] * Math.cos(ph) + Rt[0] * Math.sin(ph)) * Math.sin(th) * r, cy + Math.cos(th) * ry, rd.z + (-F0[2] * Math.cos(ph) + Rt[2] * Math.sin(ph)) * Math.sin(th) * r];
      const OPEN = 1.95;
      for (let m = 0; m <= 10; m++) { const ph = -OPEN + m / 10 * OPEN * 2, pts = []; for (let k = 0; k <= 16; k++) pts.push(at(0.05 + k / 16 * (Math.PI - 0.1), ph)); K.beam(pts, 0.028, m % 2 ? cane : caneD, 5); }
      for (let l = 1; l <= 5; l++) { const th = l / 6 * Math.PI, pts = []; for (let k = 0; k <= 16; k++) pts.push(at(th, -OPEN + k / 16 * OPEN * 2)); K.beam(pts, 0.022, caneD, 5); }
      { const pts = []; for (let k = 0; k <= 16; k++) pts.push(at(0.05 + k / 16 * (Math.PI - 0.1), OPEN)); for (let k = 16; k >= 0; k--) pts.push(at(0.05 + k / 16 * (Math.PI - 0.1), -OPEN)); K.beam(pts, 0.05, cane, 7); }
      const top = domeY(Math.hypot(rd.x, rd.z)) - 0.1;
      K.beam([[rd.x, top, rd.z], [rd.x, cy + ry, rd.z]], 0.02, C.iron, 4);
      K.bl(rd.x - F0[0] * 0.05, cy - 0.42, rd.z - F0[2] * 0.05, 0.4, 0.14, 0.36, C.dusk.clone().lerp(C.milk, 0.2), 0.12, 2);   // the seat cushion
      K.bl(rd.x - F0[0] * 0.3, cy + 0.02, rd.z - F0[2] * 0.3, 0.34, 0.3, 0.1, C.pink.clone().lerp(C.milk, 0.4), 0.12, 2);      // the back cushion
    };
    // it hangs from the rafters and sways a little, as a hung chair does
    B.read_egg = () => { const top = domeY(Math.hypot(rd.x, rd.z)) - 0.1, axis = new THREE.Vector3(Math.cos(rd.f), 0, -Math.sin(rd.f)); return { parts: [{ pivot: [rd.x, top, rd.z], build: eggBody, anim: (g, T) => g.quaternion.setFromAxisAngle(axis, 0.03 * Math.sin(T * 0.8)) }] }; };

    // the floor lamp — its light moves with its bulb (`light`)
    const lp = SLOT.lamp;
    B.lamp_brass = K => {
      K.beam([[lp.x, 0, lp.z], [lp.x, 1.95, lp.z]], 0.04, C.brass, 6);
      K.rb(lp.x, 0.04, lp.z, 0.2, 0.04, 0.2, C.brass, 4, 1);
      K.G.blob(lp.x, 2.05, lp.z, 0.28, 0.2, 0.28, () => c(0xffe2a8), 0, [0, 0, 0], 0.1, 2, 3);
      return { light: [lp.x, 2.05, lp.z] };
    };
    B.lamp_mushroom = K => {
      K.F.tube([[lp.x, 0, lp.z], [lp.x, 1.2, lp.z]], u => 0.14 - 0.05 * u, () => C.milk, 0, 0.001, [0, 0, 0], 12);
      K.glowBlob(lp.x, 1.3, lp.z, 0.46, 0.22, 0.46, c(0xffc4b8), 0.06, 3);
      [[0.2, 0.1], [-0.18, 0.2], [0.05, -0.25], [-0.26, -0.08]].forEach(([dx, dz]) => K.glowBlob(lp.x + dx, 1.46, lp.z + dz, 0.06, 0.025, 0.06, c(0xfff4e8), 0, 1));
      return { light: [lp.x, 1.25, lp.z] };
    };
    B.lamp_lantern = K => {
      // a shepherd's crook: straight up, then a hook curling over toward the lantern
      const pts = [[lp.x, 0, lp.z], [lp.x, 1.9, lp.z]]; for (let k = 1; k <= 8; k++) { const a = k / 8 * Math.PI * 0.95; pts.push([lp.x + (1 - Math.cos(a)) * 0.15, 1.9 + Math.sin(a) * 0.2, lp.z]); }
      K.beam(pts, 0.04, C.woodD, 6);
      K.rb(lp.x, 0.05, lp.z, 0.22, 0.05, 0.22, C.woodD, 4, 1);
      const hx = lp.x + 0.3;
      K.beam([[hx, 2.05, lp.z], [hx, 1.82, lp.z]], 0.012, C.iron, 4);
      K.rb(hx, 1.78, lp.z, 0.13, 0.04, 0.13, C.iron, 4, 1);
      K.glowBox(hx, 1.56, lp.z, 0.1, 0.18, 0.1, C.warm, 6);
      K.rb(hx, 1.36, lp.z, 0.12, 0.03, 0.12, C.iron, 4, 1);
      return { light: [hx, 1.56, lp.z] };
    };
    B.lamp_globe = K => {
      K.beam([[lp.x, 0, lp.z], [lp.x, 1.7, lp.z]], 0.025, C.woodD, 6);
      [0, 1, 2].forEach(j => { const b = j * TAU / 3; K.beam([[lp.x, 0.3, lp.z], [lp.x + Math.sin(b) * 0.28, 0, lp.z + Math.cos(b) * 0.28]], 0.02, C.woodD, 5); });
      K.glowBlob(lp.x, 1.95, lp.z, 0.32, 0.3, 0.32, c(0xfff0d6), 0, 3);
      for (let k = -2; k <= 2; k++) K.rb(lp.x, 1.95 + k * 0.1, lp.z, 0.33 * Math.cos(k * 0.45), 0.006, 0.33 * Math.cos(k * 0.45), C.oat, 8, 1);
      return { light: [lp.x, 1.95, lp.z] };
    };

    // pictures — PAINTED (paintings.js) and hung in a moulded frame: an outer moulding, a
    // raised lip (gilt ones with corner ornaments), a cord to a nail, the canvas in front
    const FRAMES = { gilt: [c(0xb88a3c), c(0xf2d488)], walnut: [C.woodD, C.wood.clone().lerp(C.brass, 0.15)], cream: [c(0xece2d0), c(0xcdbb9c)], ebony: [c(0x2a2430), C.brass] };
    const SHAPE = { land: [0.36, 0.27, 512, 384], port: [0.25, 0.33, 384, 512], wide: [0.42, 0.28, 560, 384], round: [0.3, 0.3, 512, 512] };
    function hang(K, at, a, it, scale = 1) {
      if (!it.art && !it.image) { K.bl(...at(0, 0.12, 0.01), 0.02, 0.02, 0.03, C.iron, 0, 1); return {}; }   // a bare nail
      const [w0, h0, pw, ph] = SHAPE[it.shape || 'land'], w = w0 * scale, h = h0 * scale, [fo, fi] = FRAMES[it.frame || 'walnut'];
      const cordTop = (it.shape === 'round' ? w + 0.07 : h + 0.08);
      K.beam([at(-w * 0.5, cordTop - 0.01, 0.012), at(0, cordTop + 0.18, 0.012), at(w * 0.5, cordTop - 0.01, 0.012)], 0.006, C.iron, 3);
      K.bl(...at(0, cordTop + 0.19, 0.015), 0.018, 0.018, 0.02, C.brass, 0, 1);
      if (it.shape === 'round') {
        // a turned ring, and the glass set INTO it (its edge runs under the ring)
        [[w + 0.05, 0.045, fo, 0.05], [w + 0.008, 0.02, fi, 0.075]].forEach(([r, t, cc, dz]) => { const pts = []; for (let k = 0; k <= 40; k++) { const q = k / 40 * TAU; pts.push(at(Math.cos(q) * r, Math.sin(q) * r, dz)); } K.beam(pts, t, cc, 8); });
        return { planes: [{ at: at(0, 0, 0.058), a, w: w + 0.015, h: h + 0.015, art: it.art, image: it.image, round: true, px: [pw, ph] }] };
      }
      // a real frame: a backing board, four moulded rails round an opening, and a raised
      // bead at the sight edge that laps over the canvas — so the painting sits IN the frame
      const bw = 0.095, bar = (cx, cy, hw, hh, dz, hd, cc, p = 18) => K.rb(...at(cx, cy, dz), hw, hh, hd, cc, p, 2, a);
      bar(0, 0, w + 0.02, h + 0.02, 0.012, 0.012, C.woodD.clone().lerp(C.iron, 0.4));                 // the backing
      [-1, 1].forEach(sd => {
        bar(0, sd * (h + bw / 2), w + bw, bw / 2, 0.045, 0.035, fo);                                       // top and bottom rails
        bar(sd * (w + bw / 2), 0, bw / 2, h, 0.045, 0.035, fo);                                            // the sides
        bar(0, sd * (h + 0.013), w + 0.026, 0.015, 0.072, 0.014, fi, 10);                                   // the bead, top and bottom
        bar(sd * (w + 0.013), 0, 0.015, h + 0.026, 0.072, 0.014, fi, 10);                                           // …and at the sides
        bar(0, sd * (h + bw - 0.014), w + bw, 0.014, 0.074, 0.01, fo.clone().lerp(fi, 0.25), 10);        // an outer ridge
        bar(sd * (w + bw - 0.014), 0, 0.014, h + bw, 0.074, 0.01, fo.clone().lerp(fi, 0.25), 10);
      });
      if (it.frame === 'gilt') [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => K.bl(...at(sx * (w + bw * 0.55), sy * (h + bw * 0.55), 0.085), 0.034, 0.034, 0.018, fi, 0.15, 2));
      return { planes: [{ at: at(0, 0, 0.06), a, w: w + 0.01, h: h + 0.01, art: it.art, image: it.image, round: false, px: [pw, ph] }] };
    }
    // a frame of reference on a wall: (dx across, dy up, dz into the room) from a centre
    const frameAt = (c0, a) => (dx, dy, dz) => [c0[0] + Math.cos(a) * dx - Math.sin(a) * dz, c0[1] + dy, c0[2] - Math.sin(a) * dx - Math.cos(a) * dz];
    const onWall = (a, y = 0, r = RAD - 0.1) => { const [x, z] = P(a, r); return frameAt([x, y, z], a); };
    const PICTURES = DC.kinds.picture;
    const pictureSet = (at, a, scale) => Object.fromEntries(PICTURES.map(it => [it.id, K => hang(K, at, a, it, scale)]));
    ['pic_west', 'pic_north', 'pic_east', 'pic_kitchen'].forEach(id => { B[id] = pictureSet(onWall(SLOT[id].a, SLOT[id].y), SLOT[id].a, 1.25); });
    B.pic_mantel = pictureSet(frameAt(A.pic_mantel.pivot, Math.PI), Math.PI, 1.2);

    // plants — a pot on the floor and what grows in it
    const plants = s => {
      const { x, z } = s;
      return {
        plant_none: () => {},
        plant_lemon: K => {
          const h = 0.5; K.pot(x, z, 0.34, h);
          K.beam([[x, h, z], [x + 0.05, h + 0.6, z - 0.03], [x - 0.02, h + 1.15, z + 0.02]], 0.045, C.woodL, 6);
          // a rounded crown of many small leaf clusters (golden-angle spread over a dome)
          for (let k = 0; k < 26; k++) { const q = k * 2.39996, v = Math.acos(1 - (k + 0.5) / 26 * 1.3), rr = 0.36 * Math.sin(v); K.bl(x + Math.cos(q) * rr, h + 1.32 + Math.cos(v) * 0.26, z + Math.sin(q) * rr, 0.12, 0.1, 0.12, C.greens[k % 3].clone().lerp(C.milk, Math.cos(v) * 0.08), 0.3, 2); }
          [0.4, 1.9, 3.3, 4.6, 5.6].forEach((q, k) => K.bl(x + Math.cos(q) * 0.42, h + 1.2 + (k % 3) * 0.1, z + Math.sin(q) * 0.42, 0.05, 0.06, 0.05, c(0xf2d060), 0.1, 2));   // lemons on the outside of the crown
        },
        plant_fern: K => {
          const h = 0.36; K.pot(x, z, 0.26, h);
          for (let k = 0; k < 12; k++) { const a = k / 12 * TAU + 0.2, out = [Math.cos(a), 0.9 - (k % 3) * 0.2, Math.sin(a)]; K.F.blade([x, h, z], out, [-Math.sin(a), 0, Math.cos(a)], 0.62 + (k % 3) * 0.1, 0.07, -0.25, u => C.greens[(k + 1) % 3].clone().lerp(c(0x9cc87a), u * 0.4), 0, [0, 0, 0], 6); }
        },
        plant_snake: K => {
          const h = 0.42; K.pot(x, z, 0.24, h);
          for (let k = 0; k < 8; k++) { const a = k / 8 * TAU, tilt = 0.12 + (k % 2) * 0.1; K.F.blade([x + Math.cos(a) * 0.06, h, z + Math.sin(a) * 0.06], [Math.cos(a) * tilt, 1, Math.sin(a) * tilt], [-Math.sin(a), 0, Math.cos(a)], 0.8 + (k % 3) * 0.18, 0.06, 0.05, u => c(0x3f6e44).lerp(c(0xa8c878), u > 0.85 ? 0.6 : 0.1), 0, [0, 0, 0], 5); }
        },
        plant_monstera: K => {
          const h = 0.46; K.pot(x, z, 0.3, h);
          for (let k = 0; k < 7; k++) {
            const a = k / 7 * TAU + 0.3, L = 0.55 + (k % 3) * 0.18, tip = [x + Math.cos(a) * L * 0.8, h + 0.5 + (k % 2) * 0.35, z + Math.sin(a) * L * 0.8];
            K.beam([[x, h, z], [x + Math.cos(a) * L * 0.4, h + 0.45 + (k % 2) * 0.3, z + Math.sin(a) * L * 0.4], tip], 0.02, C.greens[0], 5);
            [-1, 1].forEach(sd => K.F.blade(tip, [Math.cos(a), -0.15, Math.sin(a)], [-Math.sin(a) * sd, 0.2, Math.cos(a) * sd], 0.42, 0.16, -0.08, u => c(0x2f6a3a).lerp(c(0x5a9a50), u * 0.5), 0, [0, 0, 0], 6));
          }
        },
        plant_cactus: K => {
          K.pot(x, z, 0.36, 0.24);
          [[0, 0, 0.14, 0.34], [0.17, 0.1, 0.1, 0.22], [-0.15, -0.09, 0.11, 0.18]].forEach(([dx, dz, r, hh], k) => {
            K.bl(x + dx, 0.24 + hh, z + dz, r, hh, r, (px, py) => C.greens[k].clone().lerp(c(0x9cc87a), Math.abs(Math.sin(Math.atan2(px, 0.001) * 3)) > 0.9 ? 0.4 : 0), 0.05, 2);
          });
          K.bl(x, 0.24 + 0.72, z, 0.05, 0.035, 0.05, C.pink, 0.3, 1);
        },
        plant_hydrangea: K => {
          const h = 0.4; K.pot(x, z, 0.3, h);
          for (let k = 0; k < 8; k++) { const a = k * 2.4; K.bl(x + Math.cos(a) * 0.22, h + 0.25 + (k % 3) * 0.08, z + Math.sin(a) * 0.22, 0.18, 0.13, 0.18, C.greens[k % 3], 0.35, 1); }
          for (let k = 0; k < 5; k++) { const a = k * 1.26 + 0.4, rr = k === 4 ? 0 : 0.2, fx = x + Math.cos(a) * rr, fy = h + 0.55 + (k % 2) * 0.08, fz = z + Math.sin(a) * rr, cc = [c(0x9aa8ec), C.lilac, c(0xc8b8f4)][k % 3]; K.bl(fx, fy, fz, 0.13, 0.11, 0.13, cc.clone().lerp(C.woodD, 0.1), 0.1, 2); for (let f = 0; f < 14; f++) { const u = f * 2.39996, v = Math.acos(1 - (f + 0.5) / 14); K.bl(fx + Math.cos(u) * Math.sin(v) * 0.13, fy + Math.cos(v) * 0.11, fz + Math.sin(u) * Math.sin(v) * 0.13, 0.035, 0.035, 0.035, cc.clone().lerp(C.milk, 0.2 + (f % 3) * 0.1), 0, 1); } }   // mopheads of little florets
        },
        plant_sunflower: K => {
          const h = 0.42; K.pot(x, z, 0.28, h);
          [[0, 1.55, 0], [0.12, 1.25, 0.9], [-0.12, 1.4, 2.1]].forEach(([o, H, a]) => {
            const tx = x + Math.cos(a) * 0.1 + o, tz = z + Math.sin(a) * 0.1, top = [tx + Math.cos(a) * 0.12, h + H, tz + Math.sin(a) * 0.12];
            K.beam([[tx, h, tz], [tx, h + H * 0.6, tz], top], 0.025, C.greens[0], 5);
            [0.35, 0.6].forEach((u, k) => K.F.blade([tx, h + H * u, tz], [Math.cos(a + k * 2), 0.3, Math.sin(a + k * 2)], [0, 1, 0], 0.26, 0.09, -0.05, () => C.greens[1], 0, [0, 0, 0], 4));
            K.bl(top[0], top[1], top[2], 0.2, 0.2, 0.05, c(0xf2c030), 0.25, 2);
            K.bl(top[0], top[1], top[2] + 0.03, 0.09, 0.09, 0.05, c(0x6a4020), 0.1, 1);
          });
        },
      };
    };
    ['plant_a', 'plant_b', 'plant_c'].forEach(id => { const set = plants(SLOT[id]); B[id] = Object.fromEntries(Object.entries(set).map(([k, fn]) => [k, K => Object.assign({ wind: 0.45 }, fn(K) || {})])); });

    // the rug — woven into the floor itself (room.js ROOM_RUGS): its fringe stirs, gold thread gleams
    Object.keys(ROOM_RUGS).forEach(id => { B[id] = () => ({}); });

    // the ceiling lights — hung from the rafters where the lanterns always were
    const lights = SLOT.lights.list;
    const cord = (K, x, z, y) => K.beam([[x, domeY(Math.hypot(x, z)) - 0.1, z], [x, y + 0.34, z]], 0.02, C.iron, 4);
    B.lights_lanterns = K => lights.forEach(([x, z, y]) => {
      cord(K, x, z, y); K.rb(x, y + 0.3, z, 0.17, 0.05, 0.17, C.iron, 4, 1);
      K.glowBox(x, y, z, 0.13, 0.24, 0.13, C.warm, 6);
      K.rb(x, y - 0.27, z, 0.15, 0.04, 0.15, C.iron, 4, 1);
    });
    B.lights_globes = K => lights.forEach(([x, z, y], i) => {
      cord(K, x, z, y + 0.1);
      K.glowBlob(x, y, z, 0.34, 0.32, 0.34, [c(0xffd6cc), c(0xfff0d6), c(0xeadcff), c(0xfff4c0), c(0xd8f0e0)][i % 5], 0, 3);
      for (let k = -2; k <= 2; k++) K.rb(x, y + k * 0.11, z, 0.35 * Math.cos(k * 0.5), 0.006, 0.35 * Math.cos(k * 0.5), C.oat, 8, 1);
    });
    B.lights_stars = K => lights.forEach(([x, z, y], i) => {
      cord(K, x, z, y + 0.1);
      const a0 = Math.atan2(-x, -z) + Math.PI / 2, side = [Math.sin(a0), 0, Math.cos(a0)];
      for (let k = 0; k < 5; k++) {
        const q = k / 5 * TAU + i, d = [side[0] * Math.cos(q), Math.sin(q), side[2] * Math.cos(q)];
        K.F.blade([x, y, z], d, [-side[2], 0, side[0]], 0.34, 0.1, 0, () => C.brass.clone().lerp(C.milk, 0.15), 0, [0, 0, 0], 3);
        K.F.blade([x, y, z], d, [side[0] * -Math.sin(q), Math.cos(q), side[2] * -Math.sin(q)], 0.34, 0.1, 0, () => C.brass, 0, [0, 0, 0], 3);
      }
      K.glowBlob(x, y, z, 0.1, 0.1, 0.1, C.warm, 0, 2);
    });

    // ── the wardrobe — against the wall between the first window and the bed ──
    {
      const a = SLOT.wardrobe.a, at = onWall(a);
      const carcass = (K, body, door, panel, trim, knob, o = {}) => {
        K.rb(...at(0, 1.08, 0.34), 0.64, 1.0, 0.3, body, 10, 2, a);
        K.rb(...at(0, 0.09, 0.35), 0.68, 0.07, 0.33, trim, 8, 1, a);                          // the plinth
        K.rb(...at(0, 2.05, 0.35), 0.67, 0.04, 0.32, trim, 8, 1, a);                          // the crown, in two steps
        K.rb(...at(0, 2.13, 0.37), 0.71, 0.05, 0.35, trim, 8, 1, a);
        [-1, 1].forEach(sd => {
          K.rb(...at(sd * 0.315, 1.1, 0.65), 0.29, 0.86, 0.025, door, 10, 1, a);              // a door
          K.rb(...at(sd * 0.315, 1.4, 0.68), 0.2, 0.42, 0.014, panel, 10, 1, a);              // its raised panels
          K.rb(...at(sd * 0.315, 0.55, 0.68), 0.2, 0.2, 0.014, panel, 10, 1, a);
          K.bl(...at(sd * 0.05, 1.1, 0.7), 0.028, 0.028, 0.03, knob, 0, 1);
          [0.1, 0.6].forEach(dz => K.bl(...at(sd * 0.6, 0.03, dz), 0.05, 0.04, 0.05, trim, 0, 1));   // feet
        });
        if (o.extra) o.extra(K);
      };

    // ── curtains — at every window, the same style ──
    {

      const panels = (K, style) => SLOT.curtains.windows.forEach(([a, y, r]) => {

              const pinch = style.tie ? Math.exp(-Math.pow((yy - ty) / (0.22 + (yy < ty ? 0.25 : 0.1)), 2)) : 0;
              const x = lerp(cx + o * (1 + u * 0.25), tieX + o * 0.25, pinch * 0.85);

    // ── the clock — by the north-east window ──

        K.beam(arch, 0.04, C.woodD, 6);

        return { parts: [...hands, bird] };

        };

    // ── the stove — in the kitchen corner; its firebox glow is the room's (interior LAMPS) ──
    {
      const a = SLOT.stove.a, at = onWall(a), pipe = (K, from, cc = C.iron) => K.beam([at(0, from, 0.7), at(0, WALL_H + 0.9, 0.7)], 0.09, cc, 8);

      B.stove_iron = K => {
        K.rb(...at(0, 0.55, 0.7), 0.45, 0.55, 0.45, C.iron, 3);

    const DEF = Object.fromEntries(CAT.wonders.map(d => [d.id, d]));
    const glow = () => glowOf(S.home);
    const open = isle => !(String(isle) in CAT.mist) || glow() >= CAT.mist[isle];
    const settled = id => { const st = S.home.wonders[id] | 0; if (!st) return true; const need = CAT.sizes[DEF[id].size].stages[st - 1][1]; return S.day - (S.home.on[id] || 0) >= need; };
    const ready = () => ({
      wonders: CAT.wonders.filter(d => open(d.isle) && (S.home.wonders[d.id] | 0) >= 1 && (S.home.wonders[d.id] | 0) < 3 && settled(d.id)).map(d => d.id),
    });
    const push = () => { save(); HW.setHome(JSON.parse(JSON.stringify({ wonders: S.home.wonders })), S.bal, ready()); document.getElementById('day').textContent = `day ${S.day}`; };
    const opt = (label, sub, cost, ok, fn) => {
      const b = document.createElement('button'); b.className = 'opt'; b.disabled = !ok;
      b.innerHTML = `<span>${label}<small>${sub}</small></span><b>☀︎ ${cost}</b>`;
      b.onclick = () => { if (S.bal < cost) { flashHint(`Needs ${cost} sunlight`); return; } S.bal -= cost; fn(); sheet.classList.remove('on'); push(); };
      sheetL.appendChild(b);
    };
    const NAMES = ['Asleep', 'Stirring', 'Working', 'Radiant'];
    function openSheet(id) {
      sheetL.innerHTML = '';
      if (id.startsWith('mist:')) {
        sheetT.textContent = 'An isle in the mist';
        sheetL.innerHTML = `<p>The mist lifts as the isles glow brighter · glow ${glow()} of ${CAT.mist[id.slice(5)]}</p>`;
      } else {
        const d = DEF[id], st = S.home.wonders[id] | 0;
        sheetT.textContent = `${d.name} · ${NAMES[st]}`;
        sheetL.innerHTML = `<p>${d.lore}</p>`;
        if (st >= 3) sheetL.innerHTML += `<p>Radiant. ${d.stages[2]}.</p>`;
        else {
          const [cost] = CAT.sizes[d.size].stages[st], ok = settled(id);
          opt(`${NAMES[st + 1]}`, ok ? d.stages[st] : 'still settling', cost, ok, () => { S.home.wonders[id] = st + 1; S.home.on[id] = S.day; });
        }
      }
      sheet.classList.add('on');
    }
    document.getElementById('sheetX').onclick = () => sheet.classList.remove('on');
    document.getElementById('plus').onclick = () => { S.bal += 200; push(); };
    document.getElementById('day').onclick = () => { S.day += 1; push(); };
    document.getElementById('rst').onclick = () => { S = { home: { wonders: {}, on: {} }, bal: 400, day: 0 }; save(); location.reload(); };
    // for the render tests: every wonder at a stage (or a map of them), in one go
    HW.labSet = (stage, only) => {
      S.home.wonders = {}; S.home.on = {}; S.day = 999;
      CAT.wonders.forEach(d => { const st = typeof stage === 'object' ? stage[d.id] | 0 : stage; if (st && (!only || only.includes(d.id))) S.home.wonders[d.id] = st; });
      first = true; push();
    };
    setTimeout(push, 0);
    return { open: openSheet };
  })();

  { const g = withAurel(); SETTLE.offset(g.pos, g.look, 1); camPos.copy(g.pos); camLook.copy(g.look); }
  camera.position.copy(camPos); camera.lookAt(camLook);
  renderer.compile(scene, camera);                 // every shader, behind the veil
  renderer.compile(IN.scene, camera);              // …and the house's, so going in never hitches
  requestAnimationFrame(frame);
};
})();

</script>
<script>HW.start();</script>
</body></html>
