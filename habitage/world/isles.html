<script>
/* inaayratech.com web host: stands in for the Flutter app so the isles run in app mode
   (no lab chrome, the page waits for HW.setHome). Taps are forwarded to the parent page;
   sound files are answered empty, so nothing is fetched. */
window.FlutterHome = { postMessage: function (m) { try { if (parent !== window) parent.postMessage({ isles: JSON.parse(m) }, location.origin); } catch (e) {} } };
window.FlutterAudio = { postMessage: function (n) { setTimeout(function () { if (window.HW && HW.audioData) HW.audioData(n, null); }, 0); } };
</script>

<script>window.HW = { chapters: [], AUREL_GLSL: {"uniforms": "uniform float uTime;\nuniform vec3  uKeyDir;\nuniform vec3  uKeyCol;\nuniform vec3  uSkyTop;\nuniform vec3  uSkyLow;\nuniform vec3  uGround;\nuniform vec4  uLook;     // glow 0..1, flat 0..1, outfit (0 none   1 starter   2 + scarf   3 + mantle), shadow\nuniform vec3  uCloth;\nuniform vec3  uTintE;    // the being's light: edge colour\nuniform vec3  uTintC;    // the being's light: core colour\nuniform vec4  uMove;     // gait 0..1, phase, wave 0..1, breath -1..1\nuniform float uRun;      // walk 0 .. run 1\nuniform vec4  uFaceA;    // lid top, lid bottom, brow raise, brow inner raise\nuniform vec4  uFaceB;    // mouth half-width, smile, open, joy arc\nuniform vec4  uFaceC;    // gaze x, gaze y, head pitch (up +), head yaw\n", "mid": "#define PI 3.14159265\n\nfloat sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }\nfloat sdCap(vec3 p, vec3 a, vec3 b, float ra, float rb) {\n  vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);\n  return length(pa - ba * h) - mix(ra, rb, h);\n}\nfloat sdDrop(vec3 p, vec3 a, vec3 b, float r1, float r2) {\n  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;\n  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2;\n  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv); float y2 = y * y * l2; float z2 = z * z * l2;\n  float k = sign(rr) * rr * rr * x2;\n  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;\n  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;\n  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;\n}\nfloat smin(float a, float b, float k) { float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0); return mix(b, a, h) - k * h * (1.0 - h); }\nmat3 rotX(float a) { float c = cos(a), s = sin(a); return mat3(1.0, 0.0, 0.0, 0.0, c, s, 0.0, -s, c); }\nmat3 rotY(float a) { float c = cos(a), s = sin(a); return mat3(c, 0.0, -s, 0.0, 1.0, 0.0, s, 0.0, c); }\n\n//    pose (solved once per pixel)                                            \nvec3 gChest; vec3 gBelly; vec3 gPelvis; vec3 gNeckA; vec3 gNeckB; vec3 gPivot;\nvec3 gShL; vec3 gShR; vec3 gElL; vec3 gElR; vec3 gWrL; vec3 gWrR; vec3 gHaL; vec3 gHaR;\nvec3 gHiL; vec3 gHiR; vec3 gKnL; vec3 gKnR; vec3 gAnL; vec3 gAnR; vec3 gFtL; vec3 gFtR;\nfloat gFpL; float gFpR; mat3 gHeadInv; vec2 gTip; float gLean;\n\nvoid leg(vec3 hip, float swing, float bend, out vec3 knee, out vec3 ank, out float ext) {\n  knee = hip + vec3(0.0, -cos(swing), sin(swing)) * 0.097;\n  float a2 = swing - bend;\n  ank = knee + vec3(0.0, -cos(a2), sin(a2)) * 0.080;\n  ext = hip.y - ank.y;\n}\n\nvoid arm(vec3 sh, float side, float swing, float out_, float bend, float wave, out vec3 el, out vec3 wr, out vec3 ha) {\n  vec3 d1 = normalize(vec3(side * sin(out_), -cos(out_) * cos(swing), cos(out_) * sin(swing)));\n  el = sh + d1 * 0.112;\n  vec3 d2 = normalize(vec3(side * sin(out_) * 0.6, -cos(swing + bend), sin(swing + bend)));\n  float osc = sin(uTime * 9.0) * 0.45;\n  vec3 dw = normalize(vec3(side * (0.35 + osc), 1.0, 0.25));\n  d2 = normalize(mix(d2, dw, wave));\n  wr = el + d2 * 0.082;\n  ha = wr + d2 * 0.028;\n}\n\nvoid solvePose() {\n  float w = uMove.x, ph = uMove.y, r = uRun * uMove.x;\n  float amp = mix(0.42, 0.80, r);\n  float sL = w * amp * sin(ph), sR = -sL;\n  float kb = mix(0.75, 1.50, r);\n  float bL = w * kb * max(0.0, cos(ph)), bR = w * kb * max(0.0, -cos(ph));\n  float eL, eR;\n  vec3 hipL = vec3(-0.062, 0.272, 0.0), hipR = vec3(0.062, 0.272, 0.0);\n  leg(hipL, sL, bL, gKnL, gAnL, eL);\n  leg(hipR, sR, bR, gKnR, gAnR, eR);\n  // walking keeps a foot down; running leaves the ground mid-stride\n  float bob = max(eL, eR) - 0.177 + r * 0.024 * abs(sin(ph));\n  float sway = w * mix(0.006, 0.004, r) * sin(ph);\n  vec3 off = vec3(sway, bob, 0.0);\n  gHiL = hipL + off; gHiR = hipR + off;\n  gKnL += off; gKnR += off; gAnL += off; gAnR += off;\n  gFpL = (sL - bL) * 0.55; gFpR = (sR - bR) * 0.55;\n  gFtL = gAnL + rotX(-gFpL) * vec3(0.0, -0.058, 0.030);\n  gFtR = gAnR + rotX(-gFpR) * vec3(0.0, -0.058, 0.030);\n  gLean = w * mix(0.03, 0.22, r);\n\n  float br = uMove.w * 0.0025 * (1.0 - w);\n  gPelvis = vec3(0.0, 0.272, 0.0) + off;\n  gBelly  = vec3(0.0, 0.345, 0.0) + off;\n  gChest  = vec3(0.0, 0.440 + br, 0.0) + off;\n  gNeckA  = vec3(0.0, 0.490 + br, 0.0) + off;\n  gNeckB  = vec3(0.0, 0.545 + br, 0.0) + off;\n  gPivot  = vec3(0.0, 0.530 + br, 0.0) + off;\n  gShL = vec3(-0.116, 0.470 + br, 0.0) + off;\n  gShR = vec3( 0.116, 0.470 + br, 0.0) + off;\n  // arms swing against the legs; running bends them to pump\n  float aS = -sL * mix(0.85, 1.10, r);\n  float bend = mix(0.22 + w * 0.2, 1.45, r);\n  float out_ = mix(0.30, 0.20, r);\n  arm(gShL, -1.0, aS, out_, bend, 0.0, gElL, gWrL, gHaL);\n  float wv = uMove.z * (1.0 - r);\n  arm(gShR,  1.0, -aS * (1.0 - wv), mix(out_, 2.25, wv), bend, wv, gElR, gWrR, gHaR);\n\n  // the head counters the lean so the eyes stay on the road\n  float pitch = uFaceC.z + gLean * 0.55, yaw = uFaceC.w;\n  mat3 hr = rotY(yaw) * rotX(-pitch);\n  gHeadInv = transpose(hr);\n  gTip = vec2(0.004 * sin(uTime * 1.1) + w * 0.004 * sin(ph),\n              -0.012 - r * 0.014 + w * mix(0.010, 0.020, r) * sin(2.0 * ph - 0.9) + 0.003 * sin(uTime * 0.8 + 1.0));\n}\n\n//    the droplet head (rest space)                                          \nfloat headR(float t) {\n  // a fuller lower bulb, tapering to a slimmer, flame-like tip\n  if (t < 0.25) { float e = (0.25 - t) / 0.31; return 0.19 * sqrt(max(0.0, 1.0 - e * e)); }\n  float u = (t - 0.25) / 0.75;\n  return 0.19 * pow(max(0.0, 1.0 - pow(u, 1.9)), 1.15);\n}\nvec3 headSpace(vec3 p) { return gHeadInv * (p - gPivot) + vec3(0.0, 0.530, 0.0); }\nfloat sdHead(vec3 q) {\n  float t = (q.y - 0.555) / 0.445;\n  float u = clamp((t - 0.28) / 0.72, 0.0, 1.0);\n  vec2 lean = gTip * u * u * u + vec2(0.034, -0.008) * u * u * u * u;  // the tip sweeps a little, like a flame\n  vec2 r2 = vec2(q.x - lean.x, (q.z - lean.y) / 0.865);\n  float r = headR(clamp(t, -0.06, 1.0));\n  float dq = length(r2) - r;\n  float dy = max(-0.06 - t, t - 1.0) * 0.445;\n  float d = t > 1.0 ? length(vec2(max(dq, 0.0), dy)) : max(dq, dy);\n  return d * 0.62;\n}\n\nfloat footD(vec3 p, vec3 c, float pitch) { return sdEllipsoid(rotX(pitch) * (p - c), vec3(0.054, 0.034, 0.084)); }\n\nfloat mapBody(vec3 p) {\n  float torso = smin(sdEllipsoid(p - gChest, vec3(0.092, 0.078, 0.070)),\n                     sdEllipsoid(p - gBelly, vec3(0.103, 0.096, 0.078)), 0.05);\n  torso = smin(torso, sdEllipsoid(p - gPelvis, vec3(0.094, 0.060, 0.074)), 0.04);\n  float neck = sdCap(p, gNeckA, gNeckB, 0.036, 0.030);\n  float uaL = sdCap(p, gShL, gElL, 0.034, 0.031);\n  float uaR = sdCap(p, gShR, gElR, 0.034, 0.031);\n  float faL = smin(sdCap(p, gElL, gWrL, 0.030, 0.026), sdEllipsoid(p - gHaL, vec3(0.032, 0.037, 0.028)), 0.014);\n  float faR = smin(sdCap(p, gElR, gWrR, 0.030, 0.026), sdEllipsoid(p - gHaR, vec3(0.032, 0.037, 0.028)), 0.014);\n  float thL = sdCap(p, gHiL, gKnL, 0.047, 0.040);\n  float thR = sdCap(p, gHiR, gKnR, 0.047, 0.040);\n  float shL = smin(sdCap(p, gKnL, gAnL, 0.039, 0.034), footD(p, gFtL, -gFpL), 0.02);\n  float shR = smin(sdCap(p, gKnR, gAnR, 0.039, 0.034), footD(p, gFtR, -gFpR), 0.02);\n  float d = smin(torso, neck, 0.03);\n  d = smin(d, smin(uaL, faL, 0.012), 0.010);\n  d = smin(d, smin(uaR, faR, 0.012), 0.010);\n  d = smin(d, smin(thL, shL, 0.012), 0.022);\n  d = smin(d, smin(thR, shR, 0.012), 0.022);\n  return d;\n}\n\n//    clothes made for a drop of light                                       \n// 0 none   1 starter   2 starter + scarf   3 starter + mantle.\n// The STARTER is a whole costume: a short A-line traveller's smock with a rolled\n// collar and short sleeves, a sash knotted at the side, and soft cloth boots.\n// Its neckline sits low so the drop's light meets the collar.\nfloat gAccent;   // 1 when the nearest cloth is the accent (collar, sash, boot cuffs)\nfloat outfitD(vec3 p) {\n  float id = uLook.z;\n  gAccent = 0.0;\n  if (id < 0.5) return 1e5;\n  vec3 base = gPelvis + vec3(0.0, 0.0, 0.0);\n  // smock: an A-line flare from the shoulders to a gently waved hem\n  vec3 pz = vec3(p.x - gChest.x, p.y, (p.z - gChest.z) / 0.84);\n  float top = gChest.y + 0.035, hemY = gPelvis.y - 0.050;\n  float smock = sdDrop(pz, vec3(0.0, hemY + 0.02, 0.0), vec3(0.0, top - 0.02, 0.0), 0.119, 0.091) * 0.84;\n  float ang = atan(p.z - gPelvis.z, p.x - gPelvis.x);\n  smock = max(smock, hemY + 0.004 * cos(ang * 4.0) + 0.010 * sin(ang) - p.y);\n  smock = max(smock, p.y - (gNeckA.y + 0.012));\n  // short sleeves\n  float slL = sdCap(p, gShL, mix(gShL, gElL, 0.62), 0.043, 0.038);\n  float slR = sdCap(p, gShR, mix(gShR, gElR, 0.62), 0.043, 0.038);\n  float cloth = smin(smock, min(slL, slR), 0.016);\n  // soft boots: a cloth sock over the foot and lower shin\n  float btL = smin(sdEllipsoid(rotX(-gFpL) * (p - gFtL), vec3(0.056, 0.038, 0.085)), sdCap(p, mix(gKnL, gAnL, 0.45), gAnL, 0.045, 0.044), 0.02);\n  float btR = smin(sdEllipsoid(rotX(-gFpR) * (p - gFtR), vec3(0.056, 0.038, 0.085)), sdCap(p, mix(gKnR, gAnR, 0.45), gAnR, 0.045, 0.044), 0.02);\n  float boots = min(btL, btR);\n  // accents: rolled collar, the sash and its knot, the boot cuffs\n  vec3 cq = p - vec3(gChest.x, gNeckA.y + 0.004, gChest.z);\n  float collar = length(vec2(length(cq.xz / vec2(1.0, 0.86)) - 0.066, cq.y)) - 0.014;\n  float sashY = gBelly.y - 0.004;\n  vec3 sq = p - vec3(gBelly.x, sashY, gBelly.z);\n  float sash = length(vec2(length(sq.xz / vec2(1.0, 0.86)) - 0.112, (sq.y + sq.x * 0.16) / 1.6)) - 0.010;\n  float knot = sdEllipsoid(p - (gBelly + vec3(-0.068, 0.003, 0.092)), vec3(0.018, 0.014, 0.012));\n  float cuffL = length(vec2(length((p - mix(gKnL, gAnL, 0.45)).xz) - 0.046, (p - mix(gKnL, gAnL, 0.45)).y)) - 0.009;\n  float cuffR = length(vec2(length((p - mix(gKnR, gAnR, 0.45)).xz) - 0.046, (p - mix(gKnR, gAnR, 0.45)).y)) - 0.009;\n  float accent = min(min(collar, min(sash, knot)), min(cuffL, cuffR));\n  float d = min(cloth, min(boots, accent));\n  gAccent = accent <= min(cloth, boots) ? 1.0 : (boots < cloth ? 0.72 : 0.0);\n\n  vec3 nm = (gNeckA + gNeckB) * 0.5;\n  if (id > 1.5 && id < 2.5) {\n    // scarf: one soft roll tucked under the drop, its tail falling off one side\n    vec3 q = p - (nm + vec3(0.0, -0.004, 0.004));\n    vec2 tq = vec2(length(q.xz / vec2(1.0, 0.92)) - 0.074, q.y / 1.15);\n    float sc = length(tq) - 0.030;\n    vec3 a = nm + vec3(-0.066, -0.010, 0.050);\n    float sw = uMove.x * sin(uMove.y);\n    vec3 b = a + vec3(-0.030 + 0.010 * sw, -0.070, -0.004 - 0.050 * uRun * uMove.x);\n    sc = smin(sc, sdEllipsoid(p - mix(a, b, 0.5), vec3(0.020, 0.046, 0.013)), 0.016);\n    if (sc < d) { d = sc; gAccent = 2.0; }\n  }\n  if (id > 2.5) {\n    // mantle: a short scalloped cape over the shoulders, clasped at the throat\n    vec3 c = gChest + vec3(0.0, 0.012, -0.004);\n    vec3 pc = p - c;\n    float shell = abs(sdEllipsoid(pc, vec3(0.146, 0.110, 0.122))) - 0.006;\n    float an = atan(pc.z, pc.x);\n    float hem = -0.050 + 0.010 * cos(an * 7.0) - 0.018 * smoothstep(0.2, -0.9, pc.z / 0.122);\n    shell = max(shell, hem - pc.y);\n    shell = min(shell, length(p - (nm + vec3(0.0, -0.032, 0.090))) - 0.013);\n    if (shell < d) { d = shell; gAccent = 2.0; }\n  }\n  // Asymmetric folded front wrap. Its edge is geometry, so side views hold up.\n  vec3 wrapQ = p - (gBelly + vec3(0.018, 0.012, 0.077));\n  float fold = sdCap(wrapQ, vec3(-0.068,0.098,0.0), vec3(0.062,-0.066,0.014),0.008,0.006);\n  if (fold < d) { d = fold; gAccent = 0.45; }\n  // A compact travel satchel rides behind the right hip, away from the arms.\n  vec3 bagC = gBelly + vec3(0.102,-0.047,-0.070);\n  vec3 bagQ = p - bagC;\n  float bag = sdEllipsoid(bagQ,vec3(0.044,0.060,0.030));\n  float flap = sdEllipsoid(bagQ-vec3(0.0,0.025,0.012),vec3(0.046,0.025,0.025));\n  float strap = sdCap(p,gChest+vec3(-0.060,0.049,0.071),bagC+vec3(0.0,0.04,0.024),0.007,0.007);\n  float leather = min(min(bag,flap),strap);\n  if (leather < d) { d = leather; gAccent = 3.0; }\n  float clasp = sdEllipsoid(bagQ-vec3(0.0,0.020,0.036),vec3(0.009,0.011,0.003));\n  if (clasp < d) { d = clasp; gAccent = 4.0; }\n  return d;\n}\n\nvec3 unlean(vec3 p) { return vec3(p.x, p.y, p.z - gLean * max(p.y - 0.08, 0.0)); }\n\nfloat gIsHead;\nfloat gCloth;\nfloat map(vec3 p0) {\n  vec3 p = unlean(p0);\n  float dh = sdHead(headSpace(p));\n  float db = mapBody(p);\n  float dc = outfitD(p);\n  float being = smin(dh, db, 0.018);\n  gIsHead = step(dh, db);\n  gCloth = step(dc, being);\n  return min(being, dc) * 0.9;\n}\nvec3 calcNormal(vec3 p) {\n  const vec2 k = vec2(1.0, -1.0); const float h = 0.0012;\n  return normalize(k.xyy * map(p + k.xyy * h) + k.yyx * map(p + k.yyx * h) + k.yxy * map(p + k.yxy * h) + k.xxx * map(p + k.xxx * h));\n}\n\n//    painted face on the head's front (head rest space)                    \nvec3 LINE = vec3(0.290, 0.204, 0.196);\nvec4 face(vec3 q, float px, inout float em) {\n  if (q.z < 0.02) return vec4(0.0);\n  vec2 f = q.xy;\n  vec3 col = vec3(0.0); float a = 0.0;\n  float glow = mix(0.25, 1.0, uLook.x);\n  for (int i = 0; i < 2; i++) {\n    float side = i == 0 ? -1.0 : 1.0;\n    vec2 ec = vec2(side * 0.080, 0.676);\n    vec2 er = vec2(0.040, 0.057);\n    vec2 e = (f - ec) / er;\n    float pe = px / er.x * 1.2;\n    float ed = length(e);\n    float topY = 1.0 - 2.0 * uFaceA.x, botY = -1.0 + 2.0 * uFaceA.y;\n    float inside = 1.0 - smoothstep(1.0 - pe, 1.0 + pe, ed);\n    float lid = smoothstep(topY + pe, topY - pe, e.y) * smoothstep(botY - pe, botY + pe, e.y);\n    float joy = uFaceB.w * smoothstep(0.78, 0.95, uFaceA.x);\n    float open = inside * lid * (1.0 - joy);\n    vec2 g = e - vec2(uFaceC.x, uFaceC.y) * 0.22;\n    float iris = 1.0 - smoothstep(0.80 - pe, 0.80 + pe, length(g / vec2(0.92, 0.88)));\n    float warm = smoothstep(0.05, -0.75, g.y) * iris;\n    float pupil = 1.0 - smoothstep(1.0 - pe, 1.0 + pe, length(g / vec2(0.46, 0.54)));\n    vec3 eyeCol = vec3(0.141, 0.110, 0.102);\n    eyeCol = mix(eyeCol, mix(vec3(0.44, 0.27, 0.17), mix(uTintE, uTintC, 0.4), 0.35 * glow), warm);\n    eyeCol = mix(eyeCol, vec3(0.07, 0.05, 0.05), pupil);\n    float h1 = 1.0 - smoothstep(0.17 - pe, 0.17 + pe, length(e - vec2(-0.30, 0.42)));\n    float h2 = 1.0 - smoothstep(0.08 - pe, 0.08 + pe, length(e - vec2(0.30, -0.36)));\n    eyeCol = mix(eyeCol, vec3(1.0), max(h1, h2 * 0.85));\n    col = mix(col, eyeCol, open); a = max(a, open);\n    em += warm * open * 0.55 * glow;\n    // lid edge (a soft lash line where the lid cuts the eye)\n    float ly = max(topY, -0.25);\n    float axl = (f.x - ec.x) / er.x;\n    float halfW = sqrt(max(0.0, 1.0 - ly * ly));\n    float lidLine = (1.0 - smoothstep(halfW * 0.9, halfW, abs(axl))) * (1.0 - smoothstep(0.0, pe * 1.6 + 0.07, abs(e.y - ly))) * smoothstep(0.80, 0.60, topY) * (1.0 - joy);\n    col = mix(col, LINE, lidLine); a = max(a, lidLine);\n    // joy: closed happy arcs\n    float ax = (f.x - ec.x) / er.x;\n    float arcY = -0.05 + 0.55 * (1.0 - ax * ax);\n    float arc = joy * step(abs(ax), 0.95) * (1.0 - smoothstep(0.10, 0.10 + pe * 1.5, abs(e.y - arcY)));\n    col = mix(col, LINE, arc); a = max(a, arc);\n    // brow\n    vec2 bc = vec2(side * 0.080, 0.676 + 0.057 + 0.018 + uFaceA.z * 0.018);\n    float bt = (f.x - bc.x) * side / 0.024;       // +1 outer, -1 inner\n    float by = bc.y + 0.006 * (1.0 - bt * bt) + uFaceA.w * (-bt) * 0.011;\n    float bw = 0.0042 * (1.0 - 0.45 * bt * bt);\n    float brow = (1.0 - smoothstep(bw - px, bw + px, abs(f.y - by))) * (1.0 - smoothstep(0.92, 1.05, abs(bt)));\n    col = mix(col, LINE, brow); a = max(a, brow);\n  }\n  // mouth\n  float mw = uFaceB.x;\n  float mx = f.x / mw;\n  float lineY = 0.608 + uFaceB.y * 0.009 * (mx * mx - 0.4);\n  float lineA = (1.0 - smoothstep(0.0022 - px, 0.0022 + px + 0.0006, abs(f.y - lineY))) * (1.0 - smoothstep(0.9, 1.05, abs(mx)));\n  lineA *= 1.0 - smoothstep(0.12, 0.35, uFaceB.z);\n  float o = uFaceB.z;\n  float isSmile = step(0.3, uFaceB.y);\n  vec2 oc = vec2(0.0, mix(0.604 - o * 0.004, 0.611, isSmile));\n  vec2 orr = vec2(mw * mix(0.85, 0.95, isSmile), 0.002 + o * mix(0.011, 0.017, isSmile));\n  float od = length((f - oc) / orr);\n  float mouthO = (1.0 - smoothstep(1.0 - px / orr.x, 1.0 + px / orr.x, od)) * step(0.05, o);\n  mouthO *= mix(1.0, step(f.y, oc.y), isSmile);\n  vec3 mo = mix(vec3(0.22, 0.12, 0.11), vec3(0.78, 0.42, 0.38), smoothstep(0.1, -0.7, (f.y - oc.y) / orr.y));\n  col = mix(col, mo, mouthO); a = max(a, mouthO);\n  col = mix(col, LINE, lineA); a = max(a, lineA);\n  return vec4(col, a);\n}\n\nfloat glowPulse() { return mix(0.94, 1.03, 0.5 + 0.5 * sin(uTime * 1.35)); }\n\nvec3 shade(vec3 p0, vec3 rd, float px) {\n  float cloth = gCloth;\n  float accent = gAccent;\n  float isHead = gIsHead * (1.0 - cloth);\n  vec3 p = unlean(p0);\n  vec3 n = calcNormal(p0);\n  // soft contact shadow in folds, under the sash, where arms meet the body\n  float occ = 1.0;\n  for (int j = 1; j <= 3; j++) {\n    float reachAO = 0.018 * float(j);\n    occ -= max(0.0, reachAO - map(p0 + n * reachAO)) * 0.17 / reachAO;\n  }\n  occ = clamp(occ, 0.58, 1.0);\n  vec3 v = -rd;\n  vec3 L = normalize(uKeyDir);\n  float wrap = clamp((dot(n, L) + 0.4) / 1.4, 0.0, 1.0);\n  float soft = wrap * wrap * (3.0 - 2.0 * wrap);\n  float flat_ = mix(0.42, 1.0, smoothstep(0.40, 0.47, wrap));\n  float light = mix(soft, flat_, uLook.y);\n  vec3 amb = mix(uGround, uSkyTop, clamp(n.y * 0.5 + 0.5, 0.0, 1.0));\n  float nv = clamp(dot(n, v), 0.0, 1.0);\n  float g = uLook.x;\n  vec3 warm = mix(uTintE, uTintC, 0.6);\n\n  if (cloth > 0.5) {\n    vec3 accentC = mix(uCloth * 0.45, vec3(0.80, 0.72, 0.58), 0.55);\n    vec3 layerC = mix(uCloth, vec3(0.93, 0.88, 0.78), 0.62);\n    vec3 cc = accent > 3.5 ? vec3(0.57, 0.37, 0.17)      // brass clasp\n            : accent > 2.5 ? vec3(0.24, 0.16, 0.13)      // leather satchel + strap\n            : accent > 1.5 ? layerC : mix(uCloth, accentC, accent);\n    vec3 col = cc * (amb * 0.62 + uKeyCol * light * 0.78 + warm * mix(0.15, 0.33, g) * (0.55 + 0.45 * nv));\n    // the being's light bleeds through the cloth's edges and warms its top\n    col += warm * mix(0.06, 0.20, g) * pow(1.0 - nv, 2.2) * (accent > 2.5 ? 0.25 : 1.0);\n    col += warm * mix(0.04, 0.12, g) * clamp(n.y, 0.0, 1.0);\n    return col * occ;\n  }\n\n  // ONE luminous body, head to toe: brightest in the bulb of the drop,\n  // a little softer toward the hands and feet\n  vec3 pearl = mix(vec3(0.97, 0.89, 0.72), uTintC, 0.25);  // a golden being, not pearl-white\n  vec3 col = pearl * (amb * 0.62 + uKeyCol * light * 0.78);\n  col = mix(col, pearl * (0.74 + 0.20 * g), 0.5);  // it lights itself; the sky only shades it\n  vec3 q = headSpace(p);\n  float core = smoothstep(0.05, 0.95, nv);\n  float reach = isHead > 0.5 ? mix(0.66, 1.0, 1.0 - smoothstep(0.62, 1.0, q.y))\n                             : mix(0.62, 0.96, smoothstep(0.04, 0.52, p.y));\n  // organic, not a lamp: a slow breath, and soft light drifting inside the body\n  float flow = sin(p.y * 21.0 - uTime * 0.9 + sin(p.x * 17.0 + uTime * 0.4) * 1.3)\n             * sin(p.x * 13.0 + p.z * 11.0 + uTime * 0.6);\n  float lv = mix(0.60, 1.00, g) * glowPulse() * (1.0 + 0.06 * flow);\n  float amt = clamp(lv * (0.56 + 0.42 * core) * reach, 0.0, 0.90);\n  vec3 edgeC = uTintE;\n  vec3 coreC = mix(uTintC, mix(uTintC, vec3(1.0), 0.68), g);\n  vec3 emc = mix(edgeC, coreC, smoothstep(0.15, 0.9, core));\n  emc *= 0.78 + 0.30 * g;\n  col = mix(col, emc, amt);\n  col += mix(uSkyLow, vec3(0.95, 0.97, 1.0), 0.55) * pow(1.0 - nv, 3.0) * 0.18;\n  vec3 sp = (isHead > 0.5 ? q : p) * 95.0;\n  float hsh = fract(sin(dot(floor(sp), vec3(12.9898, 78.233, 37.719))) * 43758.5453);\n  float spk = step(0.965, hsh) * (1.0 - smoothstep(0.08, 0.30, length(fract(sp) - 0.5))) * core;\n  col += vec3(1.0, 0.96, 0.88) * spk * 0.18 * (0.4 + 0.6 * g);\n  // light spills out where the body leaves the costume: collar, sleeves, hem\n  if (uLook.z > 0.5) {\n    float dcl = outfitD(p);\n    col += mix(uTintE, uTintC, 0.5) * (1.0 - smoothstep(0.0, 0.035, dcl)) * mix(0.16, 0.36, g);\n  }\n  if (isHead > 0.5) {\n    float em = 0.0;\n    vec4 fc = face(q, px, em);\n    col = mix(col, fc.rgb, fc.a);\n    col += mix(uTintE, uTintC, 0.4) * em * 0.5;\n  }\n  return col;\n}\n\n"}, INSTRUMENTS: ["01-lagoon-bowl", "02-grove-kalimba", "03-meadow-handbell", "04-burrows-musicbox", "05-dell-glockenspiel", "06-cove-waterdrop", "07-orchard-harp", "08-library-piano", "09-maze-pizzicato", "10-ridge-iron", "11-dunes-brassring", "12-reef-mallet", "13-geode-crystal", "14-canyon-ocarina", "15-tarn-bowedglass", "16-aurora-celesta", "17-glasshouse-belljar", "18-mangrove-xylo", "19-terraces-bamboo", "20-orrery-bronze", "21-isles-windchime", "22-cloister-koto", "23-heron-vibraphone", "24-springs-marimba", "25-songbird-whistle", "26-causeway-bellbuoy", "27-pass-templebell", "28-starseed-harp", "29-stair-star", "30-cradle-theme"], CATALOGUE: {"v":2,"about":"THE single source for Aurel's home. build.py turns this into the page's catalogue AND lib/features/aurels_home/home_catalogue.g.dart, so the price the world shows and the price Dart charges cannot drift. See DESIGN.md.","tree":{"at":[6.75,-3.35]},"species":[{"id":"clover","name":"Clover","tier":"ground","form":"clover","leaf":"#6fae5a","flower":"#f6f2ff"},{"id":"moss","name":"Moss","tier":"ground","form":"moss","leaf":"#7dae58","flower":"#c9e07a"},{"id":"violets","name":"Violets","tier":"ground","form":"violet","leaf":"#5f9150","flower":"#9a7ee0"},{"id":"tulips","name":"Tulips","tier":"flower","form":"cup","leaf":"#6aa65a","flower":"#ff8c9e"},{"id":"lavender","name":"Lavender","tier":"flower","form":"spike","leaf":"#7f9e78","flower":"#b49ae6"},{"id":"daisies","name":"Daisies","tier":"flower","form":"flat","leaf":"#6aa65a","flower":"#fffaf0","heart":"#ffd66b"},{"id":"berries","name":"Berry bush","tier":"shrub","form":"round","leaf":"#5f9150","flower":"#d84a6a"},{"id":"fe <script>
// ── Aurel's home: the engine ─────────────────────────────────────────────────────────────────
// The Waking Isles: floating isles asleep since the Dawn, and the old wonders on them that
// sunlight wakes, stage by stage. Shares the chapters' renderer, material, sparks, Aurel,
// sound and joystick (docs/shared/), and adds its own ground, flora, sky-by-the-clock and
// the loop that ties them together. See docs/home/DESIGN.md.
//
// The page DRAWS and WALKS; it never decides. Tapping something posts {select} to the app;
// the app decides, spends, writes, and pushes the truth back with HW.setHome(). Standalone
// in a browser (the lab) a small harness stands in for the app so the island can be tried.
(function () {
'use strict';
const HW = window.HW = window.HW || {};
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k;
const sm = (a, b, x) => { const k = clamp((x - a) / (b - a), 0, 1); return k * k * (3 - 2 * k); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const col3 = h => new THREE.Color(h);
Object.assign(HW, { TAU, clamp, lerp, sm, hash, col3 });

const errEl = document.getElementById('err');
const showErr = m => { errEl.style.display = 'block'; errEl.textContent = (errEl.textContent ? errEl.textContent + '\n' : '') + String(m).slice(0, 600); };
addEventListener('error', e => showErr(e.message + (e.error && e.error.stack ? '\n' + e.error.stack.split('\n').slice(0, 3).join('\n') : '')));
{ const ce = console.error.bind(console); console.error = (...a) => { ce(...a); showErr(a.join(' ')); }; }

HW.start = function start() {
  if (!window.THREE) { showErr('three.js did not load.'); return; }
  const CAT = HW.CATALOGUE;
  const CAT_DECOR = HW.DECOR;
  const HAS_APP = typeof FlutterHome !== 'undefined';
  // ── renderer: no tone mapping; every material writes its final colour, like Aurel's shader ──
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.outputEncoding = THREE.LinearEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  document.getElementById('app').appendChild(renderer.domElement);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 600);
  // Rendering resolution. Aurel used to be a per-pixel ray-march, which held this
  // at 1.5x; as a mesh he costs what the rest of the world costs, so the world
  // starts at 2x (crisp on a 3x phone) and steps down only if a frame runs slow.
  const PIXEL_AUTO = 2.0, PIXEL_MAX = 3.0, PIXEL_MIN = 1.0;
  let pixelCap = PIXEL_AUTO;
  // The player's World quality (Settings), or a dev pin: a fixed resolution the
  // worlds never change behind their back. null = Auto.
  let PIXEL_PIN = null;
  const AUTO = { slow: 0, settle: 0, trial: null, locked: false };
  const pinPixels = v => {
    PIXEL_PIN = v == null ? null : +v;
    pixelCap = PIXEL_PIN ?? PIXEL_AUTO;
    Object.assign(AUTO, { slow: 0, settle: 2, trial: null, locked: false });
    resize();
  };
  // Auto: hold the resolution steady; step down only when frames are slow for a
  // while AND the step actually makes them faster. A phone capped at 30 fps (Low
  // Power Mode, heat) is slow at every resolution — there, a step down buys
  // nothing but blur, so it is undone and Auto stays put for the visit.
  // Called with each half-second's average frame time.
  function adaptPixels(ms) {
    if (PIXEL_PIN != null) return;
    if (AUTO.settle > 0) { AUTO.settle--; return; }       // let a resize settle before judging
    if (AUTO.trial) {
      if (ms > AUTO.trial.ms * 0.88) { pixelCap = AUTO.trial.from; AUTO.locked = true; resize(); }
      AUTO.trial = null; AUTO.settle = 2; return;
    }
    if (AUTO.locked) return;
    AUTO.slow = ms > 18.5 ? AUTO.slow + 1 : 0;            // ~1.5 s of slow frames, not one hitch
    if (AUTO.slow >= 3 && pixelCap > PIXEL_MIN) {
      AUTO.trial = { from: pixelCap, ms };
      pixelCap = Math.max(PIXEL_MIN, pixelCap - 0.25); resize();
      AUTO.slow = 0; AUTO.settle = 2;
    }
  }
  function resize() {
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, pixelCap));
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 58 : 44; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  // ── shared uniforms: fog, light, and the world's wake ──
  const FOG = { fogColor: { value: col3(0x2a2c5e) }, fogNear: { value: 18 }, fogFar: { value: 150 } };
  const LIGHT = {
    uSky: { value: col3(0x98a2ee) }, uGnd: { value: col3(0x24285a) },
    uKey: { value: new THREE.Vector3(0, 1, 0) }, uKeyCol: { value: col3(0xdfe4ff) },
    uWarm: { value: new THREE.Vector3(0, -99, 0) }, uWarmK: { value: 0 }, uWarmCol: { value: col3(0xffb86b) },
    uWake: { value: 0 }, uWaveR: { value: -10 }, uWaveC: { value: new THREE.Vector3() }, uWaveCol: { value: col3(0xffd694) },
    uWakeTint: { value: col3(0xffe0a8) },
  };
  const SOFT_V = `
    varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main() {
      mat4 im = mat4(1.0);
      #ifdef USE_INSTANCING
        im = instanceMatrix;
      #endif
      vC = vec3(1.0);
      #ifdef USE_INSTANCING_COLOR
        vC = instanceColor;
      #endif
      #ifdef USE_COLOR
        vC *= color;
      #endif
      vec4 w = modelMatrix * im * vec4(position, 1.0);
      vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * mat3(im) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`;
  const SOFT_F = `
    uniform vec3 uColor; uniform vec3 uColor2; uniform float uGradY; uniform float uEmit; uniform float uRim; uniform float uGlow;
    uniform vec3 uSky, uGnd, uKey, uKeyCol; uniform vec3 uWarm, uWarmCol; uniform float uWarmK;
    uniform float uWake, uWaveR; uniform vec3 uWaveC, uWaveCol, uWakeTint;
    uniform vec3 fogColor; uniform float fogNear, fogFar;
    varying vec3 vW; varying vec3 vN; varying vec3 vC;
    void main() {
      vec3 n = normalize(vN);
      if (!gl_FrontFacing) n = -n;
      vec3 base = mix(uColor, uColor2, clamp(vW.y * uGradY, 0.0, 1.0)) * vC;
      float wrap = clamp((dot(n, uKey) + 0.35) / 1.35, 0.0, 1.0);
      vec3 amb = mix(uGnd, uSky, n.y * 0.5 + 0.5);
      vec3 c = base * (amb * 0.75 + uKeyCol * wrap * wrap * 0.55);
      vec3 v = normalize(cameraPosition - vW);
      c += uKeyCol * pow(1.0 - max(dot(n, v), 0.0), 3.0) * uRim;
      float wd = length(vW - uWarm);
      c += uWarmCol * uWarmK * exp(-wd * 0.35) * max(dot(n, normalize(uWarm - vW)) * 0.5 + 0.5, 0.0) * base * 1.6;
      c = mix(c, base, uEmit);
      // asleep the world is dim and quiet; awake, everything lights from within
      c *= mix(0.55, 1.0, uWake);
      c = mix(c, mix(base, uWakeTint, 0.25) * 1.15, uGlow * uWake);

        const rx = sz * (0.75 + R() * 0.4);
        C.blob(e.p[0] + ox, e.p[1] + oy + sz * 0.2, e.p[2] + oz, rx, sz * (0.6 + R() * 0.25), sz * (0.75 + R() * 0.4),
          leafy(c, R, 0.4), e.t + 0.02 + k * 0.012, e.mid, 0.16, rx > 0.95 ? 3 : 2, R());
      }
    });
    const canopy = new THREE.Mesh(C.geometry(), growMat({ thick: 0.72, fade: 0.05, wind: 0.22, seed: 0.3, rim: 0.12 }));
    scene.add(canopy);

    // ── the ANCIENT tree: at the last stage its crown lights — small warm lamps of light
    // caught among the leaves, the thing you see from across the isles ──
    const lamps = ends.filter((e, i) => i % 3 === 0).slice(0, 14).map((e, i) => [e.p[0] + (R() - 0.5) * 0.8, e.p[1] + 0.2 + R() * 0.5, e.p[2] + (R() - 0.5) * 0.8, 0.5 + R() * 0.5]);

    const all = [young, tree, canopy];
    return {
      meshes: all,
      set(g) { all.forEach(m => { m.material.uniforms.uGrow.value = g; }); },
      lamps,
      // where the growing tip is, for the stream of light to aim at
      topAt: g => g < 0.12 ? [tx, ty + 0.4, tz] : g < 0.3 ? [tx, ty + 1.4, tz] : g < 0.58 ? [tx, ty + 3.0, tz] : at(clamp((g - MAIN_T0) / (MAIN_T1 - MAIN_T0), 0, 1)),
    };
  }

  // ── the species generators — one per form; a species is a row that feeds one ──
  //
  // Each fills its plot: small flowers become a patch, a shrub a bush or two, a small
  // tree one tree. `sp` is the catalogue row; everything else is seeded by the plot id,
  // so the same plot always grows the same plant.

  function spots(plot, n, R, inset = 0.78) {
    const [px, pz] = plot.at, r = PLOT_R[plot.size] * inset, out = [];
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996 + R() * 0.6, d = Math.sqrt((i + 0.5) / n) * r;
      out.push([px + Math.cos(a) * d, pz + Math.sin(a) * d]);
    }
    return out;
  }
  const areaN = (plot, perUnit) => Math.max(3, Math.round(Math.PI * PLOT_R[plot.size] ** 2 * perUnit));

  const FORMS = {
    clover(B, plot, sp, R) {
      const leaf = hex(sp.leaf), flower = hex(sp.flower), stem = leaf.clone().multiplyScalar(0.8);
      spots(plot, areaN(plot, 60), R, 0.9).forEach(([x, z], i) => {
        const y = groundY(x, z), h = 0.08 + R() * 0.08, t = 0.05 + (i % 7) * 0.035, top = [x, y + h, z];
        B.tube([[x, y, z], [x + (R() - 0.5) * 0.03, y + h * 0.6, z], top], () => 0.008, solid(stem), t, t + 0.1, null, 4);
        const a0 = R() * TAU, lc = leafy(leaf, R, 0.3);
        for (let k = 0; k < 3; k++) { const a = a0 + k * TAU / 3; B.blade(top, [Math.cos(a), 0.18, Math.sin(a)], [-Math.sin(a), 0, Math.cos(a)], 0.07, 0.045, 0.01, u => lc(0, 0.6 - u * 0.4), t + 0.12, top, 3); }
        if (R() > 0.55) {
          const fx = x + (R() - 0.5) * 0.05, fz = z + (R() - 0.5) * 0.05, fy = y + h + 0.06;
          B.tube([[fx, y, fz], [fx, fy, fz]], () => 0.006, solid(stem), 0.9, 0.95, null, 3);
          B.blob(fx, fy + 0.025, fz, 0.035, 0.03, 0.035, (px, py) => flower.clone().lerp(col3(0xffc6d8), sm(-1, -0.2, py) * 0.4), 0.95 + R() * 0.08, [fx, fy, fz], 0.35, 1, R());
        }
      });
    },
    moss(B, plot, sp, R) {
      const leaf = hex(sp.leaf), tip = hex(sp.flower);
      spots(plot, areaN(plot, 16), R, 0.85).forEach(([x, z], i) => {
        const y = groundY(x, z), s = 0.16 + R() * 0.12, t = 0.04 + (i % 5) * 0.06;
        B.blob(x, y + s * 0.2, z, s, s * 0.45, s, leafy(leaf, R, 0.5), t, [x, y, z], 0.32, 2, R());
        for (let k = 0; k < 4; k++) {
          const a = R() * TAU, d = s * 0.5 * R(), sx = x + Math.cos(a) * d, sz = z + Math.sin(a) * d, sy = y + s * 0.4, hh = 0.1 + R() * 0.06;
          B.tube([[sx, sy, sz], [sx, sy + hh, sz]], () => 0.005, solid(tip.clone().multiplyScalar(0.8)), 0.93, 0.98, null, 3);
          B.blob(sx, sy + hh, sz, 0.014, 0.024, 0.014, solid(col3(0xe8c56a)), 0.98 + R() * 0.05, [sx, sy, sz], 0, 1, R());
        }
      });
    },
    violet(B, plot, sp, R) {
      const leaf = hex(sp.leaf), flower = hex(sp.flower), eye = col3(0xffe08a);
      spots(plot, areaN(plot, 28), R, 0.88).forEach(([x, z], i) => {
        const y = groundY(x, z), t = 0.05 + (i % 6) * 0.04, lc = leafy(leaf, R, 0.25), base = [x, y + 0.01, z];
        for (let k = 0; k < 5; k++) { const a = k / 5 * TAU + R(); B.blade(base, [Math.cos(a), 0.45, Math.sin(a)], [-Math.sin(a), 0, Math.cos(a)], 0.1, 0.055, -0.02, u => lc(0, 0.2 + u * 0.5), t + k * 0.02, base, 3); }
        if (R() > 0.35) {
          const fy = y + 0.13 + R() * 0.05, fx = x + (R() - 0.5) * 0.04, fz = z + (R() - 0.5) * 0.04, ctr = [fx, fy, fz];
          B.tube([[x, y, z], [fx, fy - 0.02, fz]], () => 0.006, solid(leaf), 0.88, 0.94, null, 3);
          for (let k = 0; k < 5; k++) { const a = k / 5 * TAU; B.blade(ctr, [Math.cos(a), -0.1 + (k < 2 ? 0.5 : 0), Math.sin(a) * 0.5 + 0.6], [-Math.sin(a), 0, Math.cos(a)], 0.035, 0.022, 0.003, () => flower, 0.95 + R() * 0.06, ctr, 2); }
          B.blob(fx, fy, fz + 0.01, 0.008, 0.008, 0.008, solid(eye), 1.0, ctr, 0, 1, 1);
        }
      });
    },
    cup(B, plot, sp, R) {                                  // tulips
      const leaf = hex(sp.leaf), petal = hex(sp.flower), bud = leaf.clone().lerp(petal, 0.25);
      spots(plot, areaN(plot, 17), R, 0.82).forEach(([x, z], i) => {
        const y = groundY(x, z), h = 0.5 + R() * 0.2, lean = (R() - 0.5) * 0.08, t = 0.06 + (i % 5) * 0.03;
        const top = [x + lean, y + h, z + lean * 0.5];
        B.tube([[x, y, z], [x + lean * 0.4, y + h * 0.5, z + lean * 0.2], top], u => 0.018 * (1 - u * 0.3), solid(leaf.clone().multiplyScalar(0.85)), t, t + 0.45, null, 5);
        const lc = leafy(leaf, R, 0.3);
        for (let k = 0; k < 2; k++) { const a = R() * TAU; B.blade([x, y + 0.02, z], [Math.cos(a) * 0.35, 1, Math.sin(a) * 0.35], [-Math.sin(a), 0, Math.cos(a)], h * 0.62, 0.05, 0.08, u => lc(0, u - 0.3), t + 0.08, [x, y, z], 5); }
        // the closed bud, then the cup opening around it
        B.blob(top[0], top[1] + 0.05, top[2], 0.045, 0.075, 0.045, (px, py) => bud.clone().lerp(petal, sm(-0.4, 1, py) * 0.6), 0.7, top, 0.05, 2, R());
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * TAU + (k % 2) * 0.3, o = 0.012;
          B.blade([top[0] + Math.cos(a) * o, top[1], top[2] + Math.sin(a) * o], [Math.cos(a) * 0.32, 1, Math.sin(a) * 0.32], [-Math.sin(a), 0, Math.cos(a)], 0.13, 0.05, -0.035,

        }

    },
    spike(B, plot, sp, R) {                                // lavender
      const leaf = hex(sp.leaf), floret = hex(sp.flower), budc = leaf.clone().lerp(floret, 0.3);
      const clumps = Math.max(2, Math.round(areaN(plot, 5.5)));
      spots(plot, clumps, R, 0.55).forEach(([cx, cz], ci) => {
        const y = groundY(cx, cz), lc = leafy(leaf, R, 0.25);
        B.blob(cx, y + 0.1, cz, 0.2, 0.13, 0.2, lc, 0.05 + ci * 0.03, [cx, y, cz], 0.3, 2, R());
        for (let s = 0; s < 14; s++) {

          const pts = [[bx, y + 0.05, bz], [lerp(bx, tx, 0.5), y + h * 0.55, lerp(bz, tz, 0.5)], [tx, y + h, tz]];
          B.tube(pts, () => 0.007, solid(leaf.clone().multiplyScalar(0.9)), t, t + 0.4, null, 3);
          for (let k = 0; k < 7; k++) {
            const u = 0.72 + k * 0.04, px = lerp(bx, tx, u), pz = lerp(bz, tz, u), py = y + 0.05 + (h - 0.05) * u, sz = 0.022 - k * 0.002;
            B.blob(px, py, pz, sz, sz * 1.5, sz, solid(budc), 0.72 + k * 0.01, [px, py, pz], 0.1, 0, R());
            B.blob(px + (R() - 0.5) * 0.02, py, pz + (R() - 0.5) * 0.02, sz * 1.25, sz * 1.6, sz * 1.25, (qx, qy) => floret.clone().offsetHSL(0, 0, qy * 0.05), 0.95 + k * 0.012, [px, py, pz], 0.2, 0, R());
          }
        }
      });
    },
    flat(B, plot, sp, R) {                                 // daisies
      const leaf = hex(sp.leaf), petal = hex(sp.flower), heart = hex(sp.heart || '#ffd66b');
      spots(plot, areaN(plot, 22), R, 0.86).forEach(([x, z], i) => {
        const y = groundY(x, z), h = 0.24 + R() * 0.14, t = 0.05 + (i % 6) * 0.03, lean = (R() - 0.5) * 0.12;
        const top = [x + lean, y + h, z + lean * 0.6];
        B.tube([[x, y, z], [x + lean * 0.3, y + h * 0.5, z], top], () => 0.009, solid(leaf.clone().multiplyScalar(0.85)), t, t + 0.4, null, 4);
        const lc = leafy(leaf, R, 0.25);
        for (let k = 0; k < 4; k++) { const a = k / 4 * TAU + R(); B.blade([x, y + 0.01, z], [Math.cos(a), 0.3, Math.sin(a)], [-Math.sin(a), 0, Math.cos(a)], 0.09, 0.03, -0.01, u => lc(0, u * 0.4), t + 0.05, [x, y, z], 3); }
        B.blob(top[0], top[1], top[2], 0.03, 0.03, 0.03, solid(leaf.clone().lerp(heart, 0.3)), 0.72, top, 0.05, 1, R());
        const face = [0, 0.8, 0.6];
        for (let k = 0; k < 13; k++) {
          const a = k / 13 * TAU, dir = [Math.cos(a), 0.25 + Math.sin(a) * 0.45, Math.sin(a) * 0.9 - 0.2];
          B.blade(top, dir, [-Math.sin(a), 0.2, Math.cos(a)], 0.075, 0.017, 0.006, u => petal.clone().offsetHSL(0, 0, -u * 0.05), 0.95 + (k % 4) * 0.015, top, 2);
        }
        B.blob(top[0], top[1] + 0.012, top[2] + 0.008, 0.026, 0.016, 0.026, solid(heart), 0.99, top, 0.2, 1, R());
      });
    },
    round(B, plot, sp, R) {                                // berry bush
      const leaf = hex(sp.leaf), berry = hex(sp.flower);
      const bushes = plot.size === 'large' ? 2 : 1;
      spots(plot, bushes, R, 0.35).forEach(([cx, cz], bi) => {
        const y = groundY(cx, cz), s = PLOT_R[plot.size] * (bushes > 1 ? 0.55 : 0.78);
        const stems = [];
        for (let k = 0; k < 6; k++) {
          const a = k / 6 * TAU + R(), p = [[cx, y, cz], [cx + Math.cos(a) * s * 0.3, y + s * 0.5, cz + Math.sin(a) * s * 0.3], [cx + Math.cos(a) * s * 0.55, y + s * 0.95, cz + Math.sin(a) * s * 0.55]];
          B.tube(p, u => 0.03 * (1 - u * 0.7), solid(col3(0x6e4a36)), 0.04, 0.3, null, 5);
          stems.push(p[2]);
        }
        const lc = leafy(leaf, R, 0.35);
        for (let k = 0; k < 11; k++) {
          const a = R() * TAU, d = R() * s * 0.55, px = cx + Math.cos(a) * d, pz = cz + Math.sin(a) * d, py = y + s * (0.45 + R() * 0.55);
          B.blob(px, py, pz, s * (0.34 + R() * 0.16), s * (0.3 + R() * 0.12), s * (0.34 + R() * 0.16), lc, 0.2 + k * 0.05, stems[k % stems.length], 0.3, 2, R());
          // berries on the outside of each cluster, in bloom
          for (let q = 0; q < 6; q++) {
            const th = R() * TAU, ph = R() * 1.2 - 0.2, rr = s * 0.36;
            const bx = px + Math.cos(th) * Math.cos(ph) * rr, by = py + Math.sin(ph) * rr * 0.85, bz = pz + Math.sin(th) * Math.cos(ph) * rr;
            B.blob(bx, by, bz, 0.035, 0.035, 0.035, (qx, qy) => berry.clone().lerp(col3(0xffffff), sm(0.5, 1, qy) * 0.35), 0.95 + R() * 0.12, [px, py, pz], 0, 1, R());
          }
        }
      });
    },
    frond(B, plot, sp, R) {                                // fern
      const leaf = hex(sp.leaf), fresh = hex(sp.flower);
      const [cx, cz] = plot.at, y = groundY(cx, cz), s = PLOT_R[plot.size] * 1.25;
      const NF = 14;
      for (let f = 0; f < NF; f++) {
        const a = f / NF * TAU + R() * 0.3, L = s * (0.75 + R() * 0.35), arch = 0.55 + R() * 0.25, t = 0.05 + (f % 5) * 0.08;
        const pts = [];
        for (let j = 0; j <= 10; j++) { const u = j / 10; pts.push([cx + Math.cos(a) * L * u, y + Math.sin(u * Math.PI * 0.85) * L * arch * 0.8 + 0.02, cz + Math.sin(a) * L * u]); }
        const late = f % 3 === 0;                           // the fresh ones unfurl in bloom
        const tA = late ? 0.93 : t, tB = late ? 1.03 : t + 0.5, col = late ? fresh : leaf;
        B.tube(pts, u => 0.018 * (1 - u * 0.8), solid(col.clone().multiplyScalar(0.8)), tA, tB, null, 4);
        const lc = leafy(col, R, 0.3);
        for (let j = 1; j < 10; j++) {
          const p = pts[j], q = pts[j + 1], dx = q[0] - p[0], dy = q[1] - p[1], dz = q[2] - p[2], len = 0.16 * (1 - j / 11) + 0.04;
          const side = [-Math.sin(a), 0, Math.cos(a)];
          for (const sg of [-1, 1]) B.blade(p, [side[0] * sg + dx * 2, 0.2 + dy * 2, side[2] * sg + dz * 2], [dx, dy, dz], len, 0.03, 0.01, u => lc(0, 0.3 - u * 0.4), lerp(tA, tB, j / 10), p, 3);
        }
      }
    },
    ball(B, plot, sp, R) {                                 // hydrangea
      const leaf = hex(sp.leaf), flower = hex(sp.flower);
      const [cx, cz] = plot.at, y = groundY(cx, cz), s = PLOT_R[plot.size] * 0.82, lc = leafy(leaf, R, 0.3);
      for (let k = 0; k < 9; k++) {
        const a = R() * TAU, d = R() * s * 0.5, px = cx + Math.cos(a) * d, pz = cz + Math.sin(a) * d, py = y + s * (0.35 + R() * 0.45);
        B.blob(px, py, pz, s * 0.38, s * 0.3, s * 0.38, lc, 0.1 + k * 0.07, [cx, y, cz], 0.3, 2, R());
      }
      for (let k = 0; k < 7; k++) {
        const a = k / 7 * TAU + R() * 0.4, d = s * (0.35 + R() * 0.3), px = cx + Math.cos(a) * d, pz = cz + Math.sin(a) * d, py = y + s * (0.78 + R() * 0.28);
        const hue = flower.clone().offsetHSL((R() - 0.5) * 0.08, 0, (R() - 0.5) * 0.08);
        B.blob(px, py, pz, s * 0.2, s * 0.18, s * 0.2, (qx, qy) => hue.clone().lerp(col3(0xffffff), sm(0.2, 1, qy) * 0.3), 0.94 + k * 0.015, [px, py - 0.1, pz], 0.45, 2, R());
      }
    },
    tree(B, plot, sp, R, kind) {                           // blossom · birch · pine share a skeleton
      const [cx, cz] = plot.at, y = groundY(cx, cz) - 0.05;
      const bark = hex(sp.bark), leaf = hex(sp.leaf), bloom = hex(sp.flower);
      const H = kind === 'pine' ? 3.4 : kind === 'birch' ? 3.6 : 2.7;
      const pts = [];
      for (let j = 0; j <= 12; j++) { const u = j / 12; pts.push([cx + Math.sin(u * 2.4 + R()) * 0.12 * u, y + u * H, cz + Math.cos(u * 2 + R()) * 0.1 * u]); }

        ? u => bark.clone().lerp(col3(0x2e2a28), (Math.sin(u * 55 + R()) > 0.86 ? 0.8 : 0))
        : u => bark.clone().lerp(col3(0x94664a), (Math.sin(u * 30) * 0.5 + 0.5) * 0.25);
      const R0 = kind === 'birch' ? 0.1 : 0.16;
      B.tube(pts, u => R0 * (1 - u * 0.75) + 0.08 * Math.exp(-u * 12), barkCol, 0.02, 0.55, null, 9);
      const lc = leafy(leaf, R, kind === 'pine' ? 0.15 : 0.4);
      if (kind === 'pine') {
        for (let k = 0; k < 5; k++) {
          const u = 0.32 + k * 0.15, p = pts[Math.round(u * 12)], r = (1 - k * 0.17) * 0.95;
          B.blob(p[0], p[1], p[2], r, 0.42, r, (x, yy) => lc(x, yy).offsetHSL(0, 0, -k * 0.01), 0.2 + k * 0.13, p, 0.22, 2, R());
          for (let q = 0; q < 6; q++) { const a = R() * TAU, rr = r * 0.8; B.blob(p[0] + Math.cos(a) * rr, p[1] - 0.12, p[2] + Math.sin(a) * rr, 0.06, 0.09, 0.06, solid(bloom), 0.95 + R() * 0.1, p, 0.1, 1, R()); }
        }
        const tip = pts[12]; B.blob(tip[0], tip[1] + 0.15, tip[2], 0.22, 0.4, 0.22, lc, 0.85, tip, 0.15, 2, R());
        return;
      }
      const NB = kind === 'birch' ? 6 : 5, ends = [];
      for (let b = 0; b < NB; b++) {
        const u0 = (kind === 'birch' ? 0.45 : 0.4) + b / NB * 0.5, p0 = pts[Math.round(u0 * 12)], a = b * 2.4 + R();
        const reach = (kind === 'birch' ? 0.55 : 1.05) * (0.8 + R() * 0.4), q = [];
        for (let j = 0; j <= 5; j++) { const s = j / 5; q.push([p0[0] + Math.cos(a) * reach * s, p0[1] + s * (kind === 'birch' ? 0.8 : 0.55), p0[2] + Math.sin(a) * reach * s]); }
        const t0 = 0.02 + u0 * 0.53;
        B.tube(q, s => R0 * 0.45 * (1 - s * 0.75), barkCol, t0, t0 + 0.2, null, 6);
        ends.push({ p: q[5], mid: q[2], t: t0 + 0.2 });
      }
      ends.push({ p: pts[12], mid: pts[10], t: 0.58 });
      ends.forEach(e => {
        const s = kind === 'birch' ? 0.62 : 0.78;
        for (let k = 0; k < 3; k++) {
          const ox = (R() - 0.5) * s, oy = (R() - 0.3) * s * 0.6, oz = (R() - 0.5) * s;
          const c = leaf.clone().offsetHSL((R() - 0.5) * 0.04, 0, (R() - 0.5) * 0.06);
          B.blob(e.p[0] + ox, e.p[1] + oy + 0.1, e.p[2] + oz, s * (0.7 + R() * 0.3), s * (kind === 'birch' ? 0.85 : 0.58), s * (0.7 + R() * 0.3), leafy(c, R, 0.4), e.t + 0.04 + k * 0.03, e.mid, 0.26, 2, R());

            const a = R() * TAU, rr = s * 0.72;
            B.blob(e.p[0] + ox + Math.cos(a) * rr * 0.8, e.p[1] + oy + 0.1 + (R() - 0.3) * rr * 0.7, e.p[2] + oz + Math.sin(a) * rr * 0.8, 0.13, 0.11, 0.13, (qx, qy) => bloom.clone().lerp(col3(0xffffff), sm(0, 1, qy) * 0.4), 0.94 + R() * 0.12, e.p, 0.4, 1, R());
          }
          if (kind === 'birch') for (let q = 0; q < 4; q++) {
            const a = R() * TAU, rr = s * 0.7, hx = e.p[0] + ox + Math.cos(a) * rr, hz = e.p[2] + oz + Math.sin(a) * rr, hy = e.p[1] + oy - 0.1;

          }

      });
    },
  };

  //

      const glowBlob = (x, y, z, rx, ry, rz, c, lump = 0, detail = 2) => G.blob(x, y, z, rx, ry, rz, () => c, 0, A0, lump, detail, 3);

    const lit = new THREE.Mesh(G.geometry(), growMat({ wind: 0, emit: 0.95, rim: 0, glow: 0 }));
    [furn, lit].forEach(m => { m.material.uniforms.uGrow.value = 1.2; scene.add(m); });

    // the sky through the skylight and the windows: the real hour
    const skyM = skyDome(scene, { top: 0x3a6ec8, mid: 0x7aa6e8, hor: 0xb2cdef, horWake: 0xeaf1ff, glow: 0xffffff });
    function setSky(k) {
      const U = skyM.material.uniforms;
      U.top.value.copy(k.top); U.mid.value.copy(k.mid); U.hor.value.copy(k.hor); U.horWake.value.copy(k.horWake); U.glow.value.copy(k.glow); U.gdir.value.copy(k.glowDir);

    }
    const glows = makeGlows(scene, 220);
    // the decor: every slot holds one item, built on demand, swapped with a pop
    const PAL = { plaster, wood, woodL, woodD, thatch, thatchD, stone, stoneD, brass, iron, warm, leaf, pink, milk, lilac, rose, sage, oat, dusk, clay, greens };
    const DECOR = buildDecor(scene, { kit, woven, P, along, domeY, RAD, WALL_H, SLOT, PAL, FIRE, ROOM });

    // ── walking: the floor inside the wall, round the furniture ──
    const floorY = () => 0;
    const standLevel = (x, z) => (Math.hypot(x, z) < RAD - 0.6 && !BLOCKS.some(([bx, bz, br]) => Math.hypot(x - bx, z - bz) < br) ? 0 : -1);

    // ── the camera: orbiting Aurel, always inside the hall and under the dome ──
    const inside = (x, y, z) => { const r = Math.hypot(x, z); return r < RAD - 0.6 && y > 0.3 && y < domeY(r) - 0.35; };
    function hitBox(p, d, b) {
      let t0 = 0, t1 = 1;
      for (let k = 0; k < 3; k++) {
        const lo = b[k] - 0.1, hi = b[k + 3] + 0.1, o = p.getComponent(k), v = d.getComponent(k);
        if (Math.abs(v) < 1e-6) { if (o < lo || o > hi) return 2; continue; }
        let a = (lo - o) / v, c = (hi - o) / v; if (a > c) { const s0 = a; a = c; c = s0; }
        t0 = Math.max(t0, a); t1 = Math.min(t1, c); if (t0 > t1) return 2;
      }
      return t0;
    }
    const dir = new THREE.Vector3();
    function camera(A, orb) {
      const pivot = new THREE.Vector3(A.x, 0.9, A.z);
      const D = 4.2 * clamp(orb.zoom, 0.45, 2.2), pitch = clamp(orb.pitch, 0.08, 1.2), cp = Math.cos(pitch);
      dir.set(Math.sin(orb.yaw) * cp * D, Math.sin(pitch) * D, Math.cos(orb.yaw) * cp * D);
      let t = 1;
      for (const b of SOLIDS) { const h = hitBox(pivot, dir, b); if (h < t) t = Math.max(0.28, h - 0.05); }
      while (t > 0.28 && !inside(pivot.x + dir.x * t, pivot.y + dir.y * t, pivot.z + dir.z * t)) t -= 0.03;
      return { pos: pivot.clone().addScaledVector(dir, t), look: pivot.clone().add(new THREE.Vector3(0, -0.1, 0)) };
    }

    const [lampX, lampZ] = P(3.45, RAD - 1.6), [stoveX, stoveZ] = P(5.28, RAD - 1.26);
    return {
      scene, glows, FIRE, UP: 0,
      spawn: [0, RAD - 2.2], door: { x: 0, z: RAD - 1.0, room: 'hall' },
      bed: { x: bedAt(1.2)[0] - Math.cos(bedA) * 1.55, z: bedAt(1.2)[1] + Math.sin(bedA) * 1.55, y: 0, room: 'hall' },
      bedTop: [...bedAt(1.1).slice(0, 1), 1.3, bedAt(1.1)[1]],
      standLevel, floorY, camera, setSky, inside,
      roomOf: () => 'hall', route: (A, tx, tz) => [[tx, tz]],
      update() {}, clearFades() {}, fades: () => [], flicker,
      LAMPS: [...LANTERNS.map(([x, z, y]) => [x, y, z, 0xffd48a, 0.95]), [lampX, 2.05, lampZ, 0xffe2a8, 1.0], [stoveX, 0.5, stoveZ, 0xffa050, 0.6]],
      SKYLIGHT: { r: SKY_R, y: APEX },

  }
  // ── the room itself: walls, floor and ceiling as PAINTED surfaces ────────────────
  //
  // The hall's walls, floor and thatched ceiling are three meshes with one shader that
  // paints them — plaster, limewash, wallpaper (stripes, stencilled flowers), panelling,
  // boards, tiles, thatch — in the fragment stage, crisp at any distance, lit exactly like
  // everything else in the room. Realistic, with a little magic in how they catch the
  // light: gilded stars on night-sky paper and a painted night ceiling shimmer softly, and
  // the RUG is woven into the floor here too — its gold thread catches a slow travelling
  // gleam, its knotted fringe stirs in the draught.
  //
  // A surface item is { surf: 'wall'|'floor'|'dome', kind, a, b, c } (ROOM_SURFACES); the
  // decor sets it with ROOM.set(item).
  function buildRoomSurfaces(scene, X) {
    const { RAD, WALL_H, APEX, SKY_R, domeY } = X;
    const V = `attribute vec2 aUV; varying vec2 vUv; varying vec3 vW; varying vec3 vN;
      void main(){ vUv = aUV; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); gl_Position = projectionMatrix * viewMatrix * w; }`;
    const F = `
      uniform float uSurf, uKind, uT; uniform vec3 uA, uB, uC;
      uniform float uRug, uRugR; uniform vec2 uRugC; uniform vec3 uRA, uRB, uRC, uRD;
      uniform vec3 uSky, uGnd, uKey, uKeyCol, uWarm, uWarmCol; uniform float uWarmK, uWake;
      varying vec2 vUv; varying vec3 vW; varying vec3 vN;
      float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }
      // a field of twinkling stars in cells of size c
      float stars(vec2 p, float c, float dens){ vec2 id = floor(p / c), f = fract(p / c) - 0.5; float h = h21(id), h2 = h21(id + 3.7);
        vec2 o = vec2(h - 0.5, h2 - 0.5) * 0.7; float d = length(f - o); float tw = 0.55 + 0.45 * sin(uT * (0.8 + h * 2.2) + h2 * 30.0);
        return step(1.0 - dens, h2) * smoothstep(0.09, 0.0, d) * tw + step(1.0 - dens * 0.25, h) * smoothstep(0.22, 0.0, d) * 0.25 * tw; }
      void main(){
        vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
        vec2 uv = vUv; vec3 base = uA; vec3 glow = vec3(0.0);
        if (uSurf < 0.5) {                               // ── the walls: uv = (metres round, height) ──
          float y = uv.y;
          if (uKind < 0.5) {                             // dusky plaster
            base = mix(uB, uA, smoothstep(-0.2, 3.2, y) * (0.85 + 0.15 * sin(uv.x / 10.5 * 7.0 + y))) * (0.95 + 0.07 * vn(uv * 1.4));
          } else if (uKind < 1.5) {                      // limewash: cloudy, brushed
            base = mix(uA, uB, fbm(uv * vec2(0.9, 0.7))) * (0.96 + 0.05 * sin(uv.x * 26.0 + vn(uv * 3.0) * 8.0));
          } else if (uKind < 2.5) {                      // striped paper, with a fine pinstripe
            float s = fract(uv.x / 0.5);
            base = mix(uA, uB, step(0.5, s)); base = mix(base, uC, smoothstep(0.012, 0.0, abs(s - 0.25)) * 0.8);
            base *= 0.96 + 0.05 * vn(uv * 6.0);
          } else if (uKind < 3.5) {                      // stencilled flowers on cream
            vec2 cs = vec2(0.6, 0.55), g = uv / cs; g.x += 0.5 * mod(floor(g.y), 2.0);
            vec2 id = floor(g), f = (fract(g) - 0.5) * cs; float h = h21(id);
            float r = length(f), th = atan(f.y, f.x) + h * 6.28;
            float petal = step(r, 0.075 + 0.035 * cos(5.0 * th));
            float leaf = step(length((f - vec2(0.09, -0.07)) * vec2(1.0, 2.2)), 0.05) + step(length((f - vec2(-0.09, -0.07)) * vec2(1.0, 2.2)), 0.05);
            base = uA * (0.95 + 0.06 * vn(uv * 2.0));
            base = mix(base, vec3(0.55, 0.68, 0.48), min(1.0, leaf) * 0.85);
            base = mix(base, uB, petal); base = mix(base, uC, step(r, 0.026));
          } else if (uKind < 4.5) {                      // night-sky paper: gilded stars that softly catch the light
            base = mix(uA, uB, smoothstep(0.0, 3.6, y)) * (0.9 + 0.1 * vn(uv * 3.0));
            float st = stars(uv, 0.24, 0.5);
            base = mix(base, vec3(0.95, 0.8, 0.45), min(1.0, st * 1.4));
            glow += vec3(1.0, 0.86, 0.5) * st * 0.22;
          } else {                                       // oak panelling below a rail, paint above
            if (y < 1.15) {
              float p = fract(uv.x / 0.9); float edge = smoothstep(0.035, 0.0, min(p, 1.0 - p)) + smoothstep(0.05, 0.0, abs(y - 0.12)) + smoothstep(0.05, 0.0, abs(y - 1.02));
              base = uC * (0.88 + 0.16 * vn(vec2(uv.x * 2.0, y * 26.0))) * (1.0 - 0.3 * min(1.0, edge));
              base = mix(base, uC * 1.25, smoothstep(0.03, 0.0, abs(y - 1.12)));
            } else base = mix(uA, uB, smoothstep(1.2, 3.6, y)) * (0.96 + 0.05 * vn(uv * 1.5));
          }
        } else if (uSurf < 1.5) {                        // ── the floor: uv = (x, z) ──
          vec2 p = uv; float r = length(p);
          if (uKind < 0.5) {                             // limewashed, gently mottled
            float m = 0.5 + 0.25 * sin(p.x * 0.9 + p.y * 1.3) + 0.15 * sin(p.x * 2.3 - p.y * 1.7) + 0.1 * sin(p.x * 5.1 + p.y * 4.3);
            base = mix(uB, uA, clamp(m, 0.0, 1.0)); base = mix(base, uB, 0.25 * smoothstep(7.3, 10.5, r));
          } else if (uKind < 1.5) {                      // oak boards: planks, staggered joints, grain
            float row = floor(p.y / 0.26), off = h21(vec2(row, 1.0)) * 3.0, seg = floor((p.x + off) / 2.2);
            float sh = h21(vec2(row, seg));
            base = mix(uA, uB, sh * 0.65 + 0.35 * vn(vec2(p.x * 2.5, p.y * 38.0)));
            float seam = smoothstep(0.035, 0.0, fract(p.y / 0.26)) + smoothstep(0.006, 0.0, fract((p.x + off) / 2.2) * 2.2);
            base = mix(base, uC, min(1.0, seam) * 0.8);
          } else if (uKind < 2.5) {                      // terracotta and cream tiles, grouted
            vec2 t = p / 0.6; float ch = mod(floor(t.x) + floor(t.y), 2.0);
            base = mix(uA, uB, ch) * (0.92 + 0.1 * vn(p * 4.0));
            vec2 g = abs(fract(t) - 0.5); base = mix(base, uC, smoothstep(0.465, 0.49, max(g.x, g.y)));
          }
          // the rug, woven into the floor: a field, a border, a rim, a heart — and a knotted
          // fringe that stirs; gold thread catches a slow gleam that travels across it
          if (uRug > -0.5) {
            vec2 q = p - uRugC; float u = length(q) / uRugR, ang = atan(q.y, q.x);
            float fr = 1.0 + 0.055 + 0.008 * sin(ang * 36.0 + uT * 0.9) + 0.006 * sin(ang * 11.0 - uT * 0.6);
            if (u < fr) {
              vec3 rc; float gold = 0.0;
              if (uRug < 0.5) { rc = u > 0.92 ? uRC : u > 0.74 ? mix(uRB, uRC, step(0.0, sin(ang * 24.0)) * 0.3) : u < 0.2 ? uRD : mix(uRA, uRB, 0.1 * sin(u * 20.0)); }
              else if (uRug < 1.5) { rc = u > 0.93 ? uRC : mod(floor(u * 9.0), 2.0) > 0.5 ? uRA : uRB; }
              else if (uRug < 2.5) {                     // medallion: red field, indigo border, gold thread
                rc = u > 0.93 ? uRC : u > 0.78 ? uRB : uRA;
                float scroll = smoothstep(0.02, 0.0, abs(u - 0.855 - 0.03 * sin(ang * 16.0)));
                float med = smoothstep(0.014, 0.0, abs(u - 0.3 - 0.07 * cos(ang * 8.0))) + smoothstep(0.012, 0.0, abs(u - 0.5 - 0.05 * cos(ang * 12.0 + 0.4)));
                float ring = smoothstep(0.01, 0.0, abs(u - 0.78)) + smoothstep(0.01, 0.0, abs(u - 0.925));
                gold = min(1.0, scroll + med + ring + step(u, 0.07));
                rc = mix(rc, uRB, step(u, 0.3 + 0.07 * cos(ang * 8.0)) * 0.7 * (1.0 - step(u, 0.07)));
              } else {                                   // night-sky rug: indigo, stitched gold stars, a gold band
                rc = u > 0.93 ? uRC : uRA;
                gold = min(1.0, smoothstep(0.012, 0.0, abs(u - 0.86)) + stars(q, 0.55, 0.6) * 1.6);
              }
              rc = mix(rc, vec3(0.86, 0.7, 0.36), gold);
              // the pile: a soft weave, a little darker at the rim, and the fringe past it
              rc *= 0.92 + 0.1 * vn(q * 38.0);
              if (u > 1.0) rc = mix(uRD, vec3(0.93, 0.88, 0.78), step(0.45, fract(ang / 6.2832 * 300.0))) * (0.85 + 0.15 * (fr - u) / 0.06);
              base = rc;
              float gleam = pow(0.5 + 0.5 * sin(dot(q, vec2(0.6, 0.8)) * 1.6 - uT * 0.35), 10.0);
              glow += vec3(1.0, 0.85, 0.5) * gold * (0.05 + 0.25 * gleam);
            } else base *= 1.0 - 0.22 * smoothstep(fr + 0.07, fr, u);   // its soft shadow on the floor
          }
        } else {                                         // ── the ceiling: uv = (angle, radius) ──
          float a = uv.x, r = uv.y, j = (${RAD.toFixed(2)} - r) / ${(RAD - SKY_R).toFixed(2)} * 8.0;
          vec2 p = vec2(cos(a), sin(a)) * r;
          if (uKind < 0.5) {                             // honey thatch
            base = mix(uB, uA, 0.3 + 0.45 * (j / 8.0) + 0.2 * sin(a * 46.0 + floor(j) * 1.7)) * (0.94 + 0.08 * sin(a * 420.0 + vn(p * 3.0) * 6.0));
          } else if (uKind < 1.5) {                      // whitewashed plaster
            base = mix(uB, uA, 0.6 + 0.4 * vn(p * 0.9)) * (0.97 + 0.04 * vn(p * 6.0));
          } else if (uKind < 2.5) {                      // a painted sky, clouds drifting across it
            base = mix(uA, uB, smoothstep(1.5, ${RAD.toFixed(1)}, r));
            float cl = fbm(vec2(a * 3.0 + uT * 0.012, r * 0.35));
            base = mix(base, vec3(1.0, 0.98, 0.96), smoothstep(0.5, 0.75, cl) * 0.85);
            glow += base * 0.45;                         // a painted sky reads as lit, even from below
          } else {                                       // a painted night sky: gilded stars that shimmer softly
            base = mix(uA, uB, smoothstep(1.5, ${RAD.toFixed(1)}, r)) * (0.92 + 0.1 * vn(p * 2.0));
            float st = stars(p, 0.32, 0.55);
            base = mix(base, vec3(0.95, 0.82, 0.5), min(1.0, st * 1.3));
            glow += vec3(1.0, 0.88, 0.55) * st * 0.3 + base * 0.12;
          }
        }
        float wrap = clamp((dot(n, uKey) + 0.35) / 1.35, 0.0, 1.0);
        vec3 amb = mix(uGnd, uSky, n.y * 0.5 + 0.5);
        vec3 c = base * (amb * 0.75 + uKeyCol * wrap * wrap * 0.55);
        c += uWarmCol * uWarmK * exp(-length(vW - uWarm) * 0.35) * max(dot(n, normalize(uWarm - vW)) * 0.5 + 0.5, 0.0) * base * 1.6;
        c *= mix(0.55, 1.0, uWake);
        gl_FragColor = vec4(c + glow, 1.0);
      }`;
    const mat = surf => new THREE.ShaderMaterial({
      vertexShader: V, fragmentShader: F, side: THREE.DoubleSide,
      uniforms: Object.assign({ uSurf: { value: surf }, uKind: { value: 0 }, uT: HOME_TIME, uA: { value: col3(0xffffff) }, uB: { value: col3(0xffffff) }, uC: { value: col3(0xffffff) },
        uRug: { value: -1 }, uRugR: { value: 3.4 }, uRugC: { value: new THREE.Vector2(0, 0.4) }, uRA: { value: col3(0xffffff) }, uRB: { value: col3(0xffffff) }, uRC: { value: col3(0xffffff) }, uRD: { value: col3(0xffffff) } }, LIGHT),
    });
    const geo = (pos, nrm, uv, idx) => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3)); g.setAttribute('aUV', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeBoundingSphere(); return g; };
    const SEG = 144;
    // the walls: a cylinder, uv = (metres round, height)
    let walls, floor, dome;
    {
      const pos = [], nrm = [], uv = [], idx = [];
      for (let i = 0; i <= SEG; i++) { const a = i / SEG * TAU, x = Math.sin(a), z = Math.cos(a); [0, WALL_H].forEach(y => { pos.push(x * RAD, y, z * RAD); nrm.push(-x, 0, -z); uv.push(a * RAD, y); }); }
      for (let i = 0; i < SEG; i++) { const k = i * 2; idx.push(k, k + 1, k + 3, k, k + 3, k + 2); }
      walls = new THREE.Mesh(geo(pos, nrm, uv, idx), mat(0));
    }
    // the floor: a disc, uv = (x, z)
    {
      const pos = [0, 0, 0], nrm = [0, 1, 0], uv = [0, 0], idx = [], RINGS = 16;
      for (let r = 1; r <= RINGS; r++) for (let k = 0; k < SEG; k++) { const a = k / SEG * TAU, rr = RAD * r / RINGS, x = Math.sin(a) * rr, z = Math.cos(a) * rr; pos.push(x, 0, z); nrm.push(0, 1, 0); uv.push(x, z); }
      for (let k = 0; k < SEG; k++) idx.push(0, 1 + k, 1 + (k + 1) % SEG);
      for (let r = 1; r < RINGS; r++) for (let k = 0; k < SEG; k++) { const a0 = 1 + (r - 1) * SEG + k, b0 = 1 + (r - 1) * SEG + (k + 1) % SEG; idx.push(a0, a0 + SEG, b0 + SEG, a0, b0 + SEG, b0); }
      floor = new THREE.Mesh(geo(pos, nrm, uv, idx), mat(1));
    }
    // the ceiling: the thatched dome from the wall top to the skylight, uv = (angle, radius)
    {
      const pos = [], nrm = [], uv = [], idx = [], RINGS = 10;
      for (let j = 0; j <= RINGS; j++) { const r = lerp(RAD, SKY_R, j / RINGS); for (let i = 0; i <= SEG; i++) { const a = i / SEG * TAU; pos.push(Math.sin(a) * r, domeY(r), Math.cos(a) * r); nrm.push(-Math.sin(a) * 0.6, -0.8, -Math.cos(a) * 0.6); uv.push(a, r); } }
      for (let j = 0; j < RINGS; j++) for (let i = 0; i < SEG; i++) { const k = j * (SEG + 1) + i; idx.push(k, k + SEG + 1, k + SEG + 2, k, k + SEG + 2, k + 1); }
      dome = new THREE.Mesh(geo(pos, nrm, uv, idx), mat(2));
    }
    [walls, floor, dome].forEach(m => { m.frustumCulled = false; scene.add(m); });
    const MESH = { wall: walls, floor, dome };
    return {
      set(item) {
        const m = MESH[item.surf]; if (!m) return;
        const U = m.material.uniforms;
        U.uKind.value = item.kind; U.uA.value.set(item.a); U.uB.value.set(item.b); U.uC.value.set(item.c ?? item.b);
      },
      // the rug on the floor (ROOM_RUGS), or none
      rug(r) {
        const U = floor.material.uniforms;
        if (!r) { U.uRug.value = -1; return; }
        U.uRug.value = r.kind; U.uRA.value.set(r.a); U.uRB.value.set(r.b); U.uRC.value.set(r.c); U.uRD.value.set(r.d);
      },
    };
  }

  // What each surface item paints — kind (the pattern in the shader above) and its colours.
  const ROOM_SURFACES = {
    walls_plaster: { surf: 'wall', kind: 0, a: 0xd2b2a8, b: 0xa88a8c },
    walls_sage: { surf: 'wall', kind: 1, a: 0xb8c8a8, b: 0x98ac8e },
    walls_stripe: { surf: 'wall', kind: 2, a: 0xf0e2d0, b: 0xe2b8b0, c: 0xc89a6a },
    walls_floral: { surf: 'wall', kind: 3, a: 0xf2e8d6, b: 0xe898b0, c: 0xf2d060 },
    walls_panel: { surf: 'wall', kind: 5, a: 0xe8dcc4, b: 0xd4c4a4, c: 0x8a6040 },
    walls_night: { surf: 'wall', kind: 4, a: 0x1c2458, b: 0x2c3a7a },
    floor_limewash: { surf: 'floor', kind: 0, a: 0xa88a84, b: 0x86686a },
    floor_oak: { surf: 'floor', kind: 1, a: 0xb08058, b: 0x8a5e3e, c: 0x4a3222 },
    floor_tiles: { surf: 'floor', kind: 2, a: 0xc07058, b: 0xeadcc4, c: 0x8a7868 },
    ceil_thatch: { surf: 'dome', kind: 0, a: 0xdcb479, b: 0xb08850 },
    ceil_white: { surf: 'dome', kind: 1, a: 0xf2ead8, b: 0xd8ccb4 },
    ceil_sky: { surf: 'dome', kind: 2, a: 0x5a8ad8, b: 0xb8d4f2 },
    ceil_stars: { surf: 'dome', kind: 3, a: 0x0c1034, b: 0x2a2c6a },
  };
  // The rugs, woven into the floor (field, border, rim, heart/fringe; kind = the weave).
  const ROOM_RUGS = {
    rug_oat: { kind: 0, a: 0xc8a888, b: 0xc89070, c: 0x5e3e2a, d: 0x8fa888 },
    rug_rose: { kind: 0, a: 0xd6a4a0, b: 0xfff2e0, c: 0x9a6660, d: 0xfff2e0 },
    rug_sage: { kind: 1, a: 0x8fa888, b: 0xf0e8d8, c: 0x5e3e2a, d: 0xe8dcc4 },
    rug_medallion: { kind: 2, a: 0x8a2c2c, b: 0x2c305e, c: 0x5a1c1c, d: 0xe8dcc4 },
    rug_star: { kind: 3, a: 0x262c64, b: 0x262c64, c: 0x3a2a4a, d: 0xe8dcc4 },
  };
  // ── the paintings in Aurel's house ────────────────────────────────────────────
  //
  // Every picture is PAINTED, not drawn: on a small canvas, the way an oil painter works —
  // an underpainting of broad gradients, then hundreds of brush strokes that follow the
  // form (sky strokes lie flat, petals radiate, waves roll), impasto highlights last,
  // then the canvas weave, a vignette, and a warm coat of varnish over it all. The result
  // hangs as a texture on a plane in a moulded frame, lit by the room like everything
  // else (paintingMaterial), so a painting is dim at night and warm by the fire.
  //
  // An item may instead name an `image` (a file beside the page, e.g. art/monet.jpg) —
  // a real painting or a photo — and it hangs the same way.
  const PAINTINGS = (() => {
    const cache = {};
    // brush tools, all on a 2D context with a seeded random
    const mk = (w, h) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return [cv, cv.getContext('2d')]; };
    const hsl = (h, s, l, a = 1) => `hsla(${h}, ${s}%, ${l}%, ${a})`;
    function tools(g, W, H, seed) {
      const R = rng(seed);
      const j = (v, k) => v + (R() - 0.5) * 2 * k;
      // one stroke: a tapered, slightly curved dab of paint with a lighter edge
      function stroke(x, y, len, ang, wid, col, a = 0.85) {
        g.save(); g.translate(x, y); g.rotate(ang); g.globalAlpha = a; g.fillStyle = col;
        g.beginPath(); g.moveTo(-len / 2, 0);
        g.quadraticCurveTo(0, -wid * (0.8 + R() * 0.4), len / 2, 0); g.quadraticCurveTo(0, wid * (0.8 + R() * 0.4), -len / 2, 0);
        g.fill(); g.restore(); g.globalAlpha = 1;
      }
      // a field of strokes over a region: pos() gives a point, col(x,y) its colour, ang(x,y) its lie
      function field(n, pos, col, ang, len, wid, a = 0.8) {
        for (let i = 0; i < n; i++) { const [x, y] = pos(); const c = col(x, y); if (!c) continue; stroke(x, y, len * (0.6 + R() * 0.8), ang(x, y) + (R() - 0.5) * 0.35, wid * (0.6 + R() * 0.7), c, a * (0.6 + R() * 0.4)); }
      }
      const inRect = (x0, y0, x1, y1) => () => [x0 + R() * (x1 - x0), y0 + R() * (y1 - y0)];
      const vgrad = (stops) => { const gr = g.createLinearGradient(0, 0, 0, H); stops.forEach(([t, c]) => gr.addColorStop(t, c)); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
      const glow = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.globalAlpha = 1; };
      // the finish: canvas weave, a vignette, and a warm varnish
      function finish(warm = 0.1) {
