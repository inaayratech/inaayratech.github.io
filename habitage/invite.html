<!doctype html>
<!--
  Habitage invite landing page.

  Served at https://inaayratech.com/habitage/invite (GitHub Pages maps the
  extension-less path to invite.html). Source of truth: HabitageFlutter/web_invite.

  HOW IT WORKS: the link carries the inviter's @handle as ?u=handle.
   - App installed  → tapping "Open in Habitage" (and the auto-attempt on load)
     fires habitage://invite?u=handle, which opens the app on Add-a-Friend
     pre-filled with that handle.
   - App NOT installed → the scheme does nothing; the user taps "Get Habitage"
     to install, then RE-TAPS this same link to add the friend.
  Add the Play Store link once Android ships.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Add me on Habitage</title>
  <!-- These drive the clean link CARD shown in iMessage / WhatsApp / the iOS
       share sheet (iOS fetches this page and extracts the icon + title). -->
  <link rel="apple-touch-icon" href="https://inaayratech.com/habitage/assets/app-icon.png" />
  <link rel="icon" href="https://inaayratech.com/habitage/assets/app-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://inaayratech.com/habitage/invite" />
  <meta property="og:title" content="Add me on Habitage" />
  <meta property="og:description" content="Habit is a beautiful journey — journey together." />
  <meta property="og:image" content="https://inaayratech.com/habitage/assets/app-icon.png" />
  <style>
    :root { --bg: #020308; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.12);
            --text: #f3f5f8; --muted: #9aa3ad; --accent: #2fb98a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 420px; background: var(--card);
            border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px;
            text-align: center; backdrop-filter: blur(20px); }
    .logo { width: 64px; height: 64px; border-radius: 18px; margin: 0 auto 18px;
            background: linear-gradient(160deg, #1b6f57, #2fb98a); display: flex;
            align-items: center; justify-content: center; font-size: 30px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px; }
    .handle { color: var(--accent); font-weight: 700; }
    p { color: var(--muted); font-size: 15px; line-height: 1.45; margin: 0 0 24px; }
    .btn { display: block; width: 100%; padding: 15px 18px; border-radius: 16px;
           font-size: 17px; font-weight: 600; text-decoration: none; margin-top: 12px;
           border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #03130d; }
    .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); border-color: var(--border); }
    .hint { color: var(--muted); font-size: 13px; margin-top: 20px; line-height: 1.4; }
    .tagline { color: var(--muted); font-size: 12px; margin-top: 26px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⛵️</div>
    <h1><span id="who">Someone</span> added you</h1>
    <p>They're on <strong>Habitage</strong> — where habits become journeys.
       Open the app to add <span class="handle" id="handle">them</span> back.</p>

    <a class="btn btn-primary" id="openBtn" href="#">Open in Habitage</a>
    <a class="btn btn-secondary" id="storeBtn" href="#">Get Habitage</a>

    <div class="hint">Don't have the app yet? Install it, then tap this link again to add your friend.</div>
    <div class="tagline">Habit is a beautiful journey.</div>
  </div>

  <script>
    var APP_STORE_URL = "https://apps.apple.com/app/id6745517036";

    var params = new URLSearchParams(window.location.search);
    var handle = (params.get("u") || "").trim();

    if (handle) {
      document.getElementById("who").textContent = "@" + handle;
      document.getElementById("handle").textContent = "@" + handle;
    }

    var appUrl = "habitage://invite?u=" + encodeURIComponent(handle);
    document.getElementById("openBtn").setAttribute("href", appUrl);
    document.getElementById("storeBtn").setAttribute("href", APP_STORE_URL);

    // Best-effort auto-open if the app is installed. If it isn't, nothing happens
    // and the buttons remain — the user installs, then re-taps the link to add.
    if (handle) {
      window.location.href = appUrl;
    }
  </script>
</body>
</html>
