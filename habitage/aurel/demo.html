<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meet Aurel</title>
<style>
  :root {
    --night: #0a0d1c; --violet: #2a1e5e; --rose: #c07aa0; --amber: #f3b27a; --lamp: #eadbc3;
    --ease: cubic-bezier(.22,.8,.2,1);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Nunito", system-ui, sans-serif;
  }
  html, body { margin: 0; background: var(--night); color: var(--lamp); }
  body {
    background: linear-gradient(180deg, var(--night) 0%, #141238 30%, var(--violet) 55%, #5a3a7e 78%, #8a5790 100%);
    min-height: 100vh;
  }
  .spacer { height: 110vh; display: grid; place-items: center; text-align: center; padding: 0 16px; }
  .spacer p { opacity: .6; font-size: 17px; }
  section.meet {
    min-height: 100vh; display: grid; align-items: center; justify-items: center;
    grid-template-columns: minmax(0, 1fr); padding: 48px 16px 64px; box-sizing: border-box;
  }
  @media (min-width: 900px) {
    section.meet { grid-template-columns: minmax(0, 560px) minmax(0, 420px); gap: 48px; justify-content: center; }
  }
  #aurel { width: min(100%, 560px); aspect-ratio: 4 / 5; max-height: 78vh; }
  .copy h2 { font-size: clamp(34px, 5vw, 52px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 14px; color: #fff4e4; }
  .copy p { font-size: 18px; line-height: 1.55; margin: 0 0 22px; opacity: .85; max-width: 26ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; }
  .controls button {
    font: inherit; font-size: 15px; color: var(--lamp); background: rgba(234,219,195,.10);
    border: 1px solid rgba(234,219,195,.22); border-radius: 999px; padding: 8px 14px; cursor: pointer;
    transition: background 300ms var(--ease);
  }
  .controls button:hover { background: rgba(234,219,195,.2); }
</style>
</head>
<body>
  <div class="spacer" style="height:200vh"><p>Scroll down to meet him.</p></div>
  <section class="meet">
    <div id="aurel"></div>
    <div class="copy">
      <h2>This is Aurel.</h2>
      <p>He'll walk every journey with you.</p>
      <div class="controls">
        <button data-a="wave">Wave</button>
        <button data-m="rest">Rest</button>
        <button data-m="joy">Joy</button>
        <button data-m="wonder">Wonder</button>
      </div>
    </div>
  </section>
  <div class="spacer" style="height:60vh"></div>
<script type="module">
  import { mountAurel } from './aurel.js';
  const q = new URLSearchParams(location.search);
  const aurel = mountAurel(document.getElementById('aurel'), {
    debug: q.has('debug'),
    reducedMotion: q.has('rm') ? true : null,
  });
  window.aurel = aurel;
  document.querySelector('.controls').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.a === 'wave') aurel.wave(); else aurel.setMood(b.dataset.m, 2);
  });
</script>
</body>
</html>
